[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/data",
    "crates/indicator",
    "crates/ledger",
    "crates/strategy",
    "crates/engine",
    "crates/report",
    "crates/pattern",
    "crates/herald",
    "crates/alm-py", "crates/alm-wasm",
]

[workspace.dependencies]
# Internal
alm-core      = { path = "./crates/core" }
alm-data      = { path = "./crates/data" }
alm-indicator = { path = "./crates/indicator" }
alm-ledger    = { path = "./crates/ledger" }
alm-strategy  = { path = "./crates/strategy" }
alm-report    = { path = "./crates/report" }
alm-pattern   = { path = "./crates/pattern" }

# Async
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

# Error
thiserror = "2"
anyhow = "1"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Protobuf — schema-first binary serialization for NATS messages
prost = "0.14"
prost-types = "0.14"

# NATS messaging
async-nats = "0.47"

# Time
chrono    = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "json", "uuid"] }

# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

# ── Build profiles ────────────────────────────────────────────────────────────

[profile.dev]
# Reduce debug symbols: line tables only (much smaller .d files, faster link)
debug = 1
# Disable incremental for cleaner target dir (trade: slightly slower rebuilds)
incremental = false

[profile.dev.package."*"]
# Optimize dependencies fully even in dev — faster runtime, no impact on iteration
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = 1
