[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "alm-py"
version = "0.1.0"
description = "Python bindings for the almanac backtesting engine"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "polars>=0.20",
    "pyarrow>=10.0",
    "matplotlib>=3.5",
    "backtrader>=1.9.76.122",
    "backtesting>=0.3.3",
    "vectorbt>=0.25.0",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "nbformat>=5.7",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "maturin>=1.5,<2.0",
]

[tool.maturin]
# Cargo.toml is one level up from pyproject.toml location — point maturin at it
# (maturin auto-discovers when pyproject.toml sits next to Cargo.toml)
features    = ["pyo3/extension-module"]
module-name = "alm_py"
