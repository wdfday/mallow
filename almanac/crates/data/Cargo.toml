[package]
name = "alm-data"
version = "0.1.0"
edition = "2021"

[dependencies]
alm-core    = { workspace = true }
anyhow      = { workspace = true }
parquet     = { version = "58", default-features = false, features = ["arrow"] }
arrow-array = "58"
arrow-schema = "58"

[dev-dependencies]
criterion = { workspace = true }
pprof     = { version = "0.13", features = ["flamegraph", "criterion"] }
libc      = "0.2"

[[bench]]
name = "benches/feed_bench"
harness = false
