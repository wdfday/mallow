[package]
name = "alm-engine"
version = "0.1.0"
edition = "2021"

# src/bin/*.rs are auto-discovered by Cargo

[dependencies]
alm-core      = { workspace = true }
alm-data      = { path = "../data" }
alm-strategy  = { path = "../strategy" }
alm-report    = { path = "../report" }
thiserror    = { workspace = true }
anyhow       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
chrono       = { workspace = true }
tracing      = { workspace = true }
metrics       = { workspace = true }
# Derives for backtest DTOs so downstream services (herald HTTP) can
# optionally wire them into Swagger without re-defining the schema.
utoipa       = { version = "4", features = ["axum_extras"] }

# Native-only deps: filesystem loading, threads, async, timezone. The wasm
# build (alm-wasm in-browser backtest) uses only the in-memory Engine + report;
# the `data`/`runner`/`backtest`/`walk_forward` modules are cfg'd out there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono-tz          = { workspace = true }
tracing-subscriber = { workspace = true }
tokio              = { workspace = true }
walkdir            = "2"
rayon              = "1"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "backtest"
path = "benches/backtest.rs"
harness = false
