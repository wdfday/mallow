[package]
name = "alm-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "alm-engine"
path = "src/main.rs"

# src/bin/*.rs are auto-discovered by Cargo

[dependencies]
alm-core      = { workspace = true }
alm-data      = { path = "../data" }
alm-indicator = { path = "../indicator" }
alm-strategy  = { path = "../strategy" }
alm-report    = { path = "../report" }
thiserror    = { workspace = true }
anyhow       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
chrono       = { workspace = true }
chrono-tz    = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
tokio        = { workspace = true }
walkdir      = "2"
# Derives for backtest DTOs so downstream services (herald HTTP) can
# optionally wire them into Swagger without re-defining the schema.
utoipa       = { version = "4", features = ["axum_extras"] }

# Parallel batch optimization
rayon = "1"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "backtest"
path = "benches/backtest.rs"
harness = false
