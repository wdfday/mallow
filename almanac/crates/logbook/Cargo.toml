[package]
name = "logbook"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "logbook"
path = "src/main.rs"

[[bin]]
name = "logbook-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[dependencies]
alm-core     = { workspace = true }
alm-data     = { path = "../data" }
alm-engine   = { path = "../engine" }
alm-report   = { path = "../report" }
alm-strategy    = { path = "../strategy" }
alm-indicator   = { path = "../indicator" }
polars         = { version = "0.46", default-features = false, features = ["lazy", "parquet", "dtype-date", "dtype-datetime"] }
anyhow      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
async-nats  = { workspace = true }
futures     = "0.3"
tokio       = { workspace = true }
chrono      = { workspace = true }
chrono-tz   = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir     = "2"
rayon       = "1"
prost       = "0.13"

# HTTP API + Swagger
axum              = { version = "0.7", features = ["macros"] }
tower-http        = { version = "0.5", features = ["cors", "trace"] }
utoipa            = { version = "4",   features = ["axum_extras"] }
utoipa-swagger-ui = { version = "7",   features = ["axum"] }

[dev-dependencies]
alm-indicator = { path = "../indicator" }
alm-pattern   = { path = "../pattern" }
