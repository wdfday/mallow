[package]
name = "alm-strategy"
version = "0.1.0"
edition = "2021"

[dependencies]
alm-core      = { workspace = true }
alm-indicator = { workspace = true }
alm-pattern   = { path = "../pattern" }
serde           = { workspace = true }
serde_json      = { workspace = true }
anyhow          = { workspace = true }
evalexpr        = { workspace = true }
cel-interpreter = { workspace = true }
rhai            = { version = "1", features = ["sync"] }
# Derives for the strategy / indicator catalogue so HTTP layers can expose
# the list via Swagger without cloning the schema.
utoipa          = { version = "4", features = ["axum_extras"] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "expr"
harness = false
