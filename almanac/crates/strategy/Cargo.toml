[package]
name = "alm-strategy"
version = "0.1.0"
edition = "2021"

[features]
# Enable utoipa::ToSchema derives on catalogue and lint types.
# Herald enables this; WASM builds must not.
openapi = ["dep:utoipa"]

[dependencies]
alm-core      = { workspace = true }
alm-indicator = { workspace = true }
alm-pattern   = { path = "../pattern" }
serde           = { workspace = true }
serde_json      = { workspace = true }
anyhow          = { workspace = true }
rhai            = { version = "1", features = ["sync"] }
tracing         = { workspace = true }
utoipa          = { version = "4", features = ["axum_extras"], optional = true }

[dev-dependencies]
alm-data   = { path = "../data" }
alm-engine = { path = "../engine" }
criterion  = { workspace = true }

[[bench]]
name = "expr"
harness = false
