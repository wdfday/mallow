[package]
name = "alm-vectorized"
version = "0.1.0"
edition = "2021"

[dependencies]
alm-core = { workspace = true }
serde   = { workspace = true }
serde_json = { workspace = true }
anyhow  = { workspace = true }
rayon   = "1"

# Polars for column-wise vectorized operations
polars = { version = "0.46", default-features = false, features = [
    "parquet", "lazy", "dtype-full", "streaming",
] }
