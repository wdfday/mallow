openapi: 3.0.3
info:
  title: Herald API
  description: Signal engine HTTP API
  license:
    name: ''
  version: 0.1.0
paths:
  /api/v1/backtest:
    post:
      tags:
      - backtest
      operationId: run_backtest
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
        required: true
      responses:
        '200':
          description: Backtest report
        '400':
          description: Bad request
        '429':
          description: Too many concurrent backtests
  /api/v1/backtest/script:
    post:
      tags:
      - backtest
      operationId: run_backtest_script
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptBacktestRequest'
        required: true
      responses:
        '200':
          description: Script backtest report with saved IDs
        '400':
          description: Bad request
        '429':
          description: Too many concurrent backtests
  /api/v1/data/{symbol}:
    post:
      tags:
      - live
      operationId: unified_data
      parameters:
      - name: symbol
        in: path
        description: Symbol name e.g. BTCUSDT
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnifiedDataRequest'
        required: true
      responses:
        '200':
          description: Unified OHLCV + indicator snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedDataResponse'
        '404':
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/indicators:
    get:
      tags:
      - live
      operationId: list_indicators_catalog
      responses:
        '200':
          description: Indicator catalogue (static)
  /api/v1/script/validate:
    post:
      tags:
      - backtest
      operationId: validate_script
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptValidateReq'
        required: true
      responses:
        '200':
          description: Lint result — empty errors means clean script
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptValidateResp'
        '400':
          description: Request body malformed
  /api/v1/store/cases:
    get:
      tags:
      - strategy
      operationId: list_cases
      responses:
        '200':
          description: List of backtest cases
    post:
      tags:
      - strategy
      operationId: create_case
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseReq'
        required: true
      responses:
        '201':
          description: Case created
        '400':
          description: strategy_id not found
  /api/v1/store/cases/{id}:
    get:
      tags:
      - strategy
      operationId: get_case
      parameters:
      - name: id
        in: path
        description: Case UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Backtest case
        '404':
          description: Not found
    put:
      tags:
      - strategy
      operationId: update_case
      parameters:
      - name: id
        in: path
        description: Case UUID
        required: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCaseReq'
        required: true
      responses:
        '200':
          description: Updated case
        '404':
          description: Not found
    delete:
      tags:
      - strategy
      operationId: delete_case
      parameters:
      - name: id
        in: path
        description: Case UUID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
  /api/v1/store/cases/{id}/results:
    get:
      tags:
      - strategy
      operationId: list_results
      parameters:
      - name: id
        in: path
        description: Case UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Results for the case
  /api/v1/store/cases/{id}/run:
    post:
      tags:
      - strategy
      operationId: run_case
      parameters:
      - name: id
        in: path
        description: Case UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Backtest report
        '404':
          description: Not found
        '429':
          description: Too many concurrent backtests
  /api/v1/store/cases/{id}/signals:
    post:
      tags:
      - strategy
      summary: Replay historical bars through the case's strategy and return the raw
      description: signal stream — no SimBroker, no position tracking, no report.
      operationId: run_case_signals
      parameters:
      - name: id
        in: path
        description: Case UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Signal replay list
        '404':
          description: Not found
        '429':
          description: Too many concurrent backtests
  /api/v1/store/results/{id}:
    get:
      tags:
      - strategy
      operationId: get_result
      parameters:
      - name: id
        in: path
        description: Result UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Backtest result
        '404':
          description: Not found
    delete:
      tags:
      - strategy
      operationId: delete_result
      parameters:
      - name: id
        in: path
        description: Result UUID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
  /api/v1/store/strategies:
    get:
      tags:
      - strategy
      operationId: list_strategies
      responses:
        '200':
          description: List of saved strategies
    post:
      tags:
      - strategy
      operationId: create_strategy
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrategyReq'
        required: true
      responses:
        '201':
          description: Strategy created
        '409':
          description: Conflict — version already exists
  /api/v1/store/strategies/{id}:
    get:
      tags:
      - strategy
      operationId: get_strategy
      parameters:
      - name: id
        in: path
        description: Strategy UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Strategy record
        '404':
          description: Not found
    put:
      tags:
      - strategy
      operationId: update_strategy
      parameters:
      - name: id
        in: path
        description: Strategy UUID
        required: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStrategyReq'
        required: true
      responses:
        '200':
          description: Updated strategy record
        '404':
          description: Not found
    delete:
      tags:
      - strategy
      operationId: delete_strategy
      parameters:
      - name: id
        in: path
        description: Strategy UUID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
        '409':
          description: Referenced by cases
  /api/v1/store/strategies/{name}/versions:
    get:
      tags:
      - strategy
      operationId: list_strategy_versions
      parameters:
      - name: name
        in: path
        description: Strategy name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: All versions for the named strategy
  /api/v1/strategies:
    get:
      tags:
      - backtest
      operationId: list_strategies
      responses:
        '200':
          description: List of registered named strategy keys
  /api/v1/stream/signals:
    get:
      tags:
      - stream
      operationId: stream_signals
      responses:
        '200':
          description: 'SSE signal stream (text/event-stream, event: signal)'
  /api/v1/stream/{symbol}:
    post:
      tags:
      - stream
      operationId: stream_bars
      parameters:
      - name: symbol
        in: path
        description: Symbol e.g. BTCUSDT
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamRequest'
        required: true
      responses:
        '200':
          description: SSE bar+indicator stream (text/event-stream)
  /api/v1/symbols:
    get:
      tags:
      - live
      operationId: list_symbols
      parameters:
      - name: indicators
        in: query
        description: Include live indicator cells in the response
        required: false
        schema:
          type: boolean
          nullable: true
      responses:
        '200':
          description: List of tracked symbols
  /api/v1/watch:
    get:
      tags:
      - watch
      operationId: list_watches
      responses:
        '200':
          description: List of watch entries
    post:
      tags:
      - watch
      operationId: create_watch
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWatchReq'
        required: true
      responses:
        '201':
          description: Watch entry created
        '400':
          description: Validation error
  /api/v1/watch/{id}:
    get:
      tags:
      - watch
      operationId: get_watch
      parameters:
      - name: id
        in: path
        description: Watch entry UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Watch entry
        '404':
          description: Not found
    delete:
      tags:
      - watch
      operationId: delete_watch
      parameters:
      - name: id
        in: path
        description: Watch entry UUID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
components:
  schemas:
    BacktestCase:
      type: object
      description: A parameterised backtest run configuration linked to a specific strategy version.
      required:
      - id
      - strategy_id
      - label
      - symbol
      - capital
      - execution
      - created_at
      - updated_at
      properties:
        capital:
          $ref: '#/components/schemas/PositionConfig'
        created_at:
          type: integer
          format: int64
        data_source:
          type: string
          nullable: true
        execution:
          $ref: '#/components/schemas/ExecutionConfig'
        from_ms:
          type: integer
          format: int64
          description: Inclusive start of the backtest window (Unix ms). `None` = feed start.
          nullable: true
        id:
          type: string
        label:
          type: string
        strategy_id:
          type: string
          description: Points to a specific Strategy version UUID.
        symbol:
          type: string
        timeframe:
          type: string
          nullable: true
        to_ms:
          type: integer
          format: int64
          description: Inclusive end of the backtest window (Unix ms). `None` = feed end.
          nullable: true
        updated_at:
          type: integer
          format: int64
    BacktestRequest:
      type: object
      required:
      - strategy
      - symbol
      properties:
        asset_type:
          type: string
          description: |-
            Asset class — controls lot sizing.
            `"crypto"` → fractional qty; `"stock"` → whole shares; `"vn_stock"` → lots of 100.
          nullable: true
        commission_pct:
          type: number
          format: double
          description: 'Commission per trade as a fraction of trade value (default: 0.001).'
          nullable: true
        data_source:
          type: string
          description: |-
            Data source — selects which provider subdirectory to load bars from.
            Values: `"polygon"` (US stocks), `"bnb"` (Binance crypto),
            `"vci"` (VN stocks), `"okx"` (OKX crypto).
            Derives market region automatically: polygon→us, vci→vn, bnb/okx→crypto (no filter).
          nullable: true
        from:
          type: string
          description: 'Date range start, inclusive. Format: `"YYYY-MM-DD"`.'
          nullable: true
        initial_capital:
          type: number
          format: double
          description: 'Starting capital in USD (default: 10 000).'
          nullable: true
        intra_bar_mode:
          type: string
          description: |-
            Intra-bar stop detection mode.
            `"close_only"` (default) | `"pessimistic"` | `"ohlc_heuristic"`.
          nullable: true
        market_hours_only:
          type: boolean
          description: Drop bars outside regular market hours.
          nullable: true
        max_positions:
          type: integer
          description: 'Maximum simultaneous open positions (default: 1).'
          nullable: true
          minimum: 0
        min_strength:
          type: number
          format: double
          description: |-
            Minimum signal strength [0.0, 1.0] — signals below this threshold are
            filtered out. Only meaningful for named strategies with variable strength.
          nullable: true
        monte_carlo:
          allOf:
          - $ref: '#/components/schemas/MonteCarloConfig'
          nullable: true
        params:
          description: |-
            Strategy-specific parameters as a JSON object.

            All values are scalars (`f64` or `u64`), except for array params such as
            GMMA period lists. Unknown keys are silently ignored; missing keys use
            per-strategy defaults.
          nullable: true
        position_size_pct:
          type: number
          format: double
          description: 'Fraction of equity to allocate per trade (default: 0.95).'
          nullable: true
        position_size_quantity:
          type: number
          format: double
          description: Fixed quantity per trade. Overrides both USD and pct sizing.
          nullable: true
        position_size_usd:
          type: number
          format: double
          description: Fixed dollar amount per trade. Overrides `position_size_pct`.
          nullable: true
        risk_free_annual:
          type: number
          format: double
          description: 'Risk-free annual rate used for Sharpe/Sortino (default: 0.04).'
          nullable: true
        slippage_pct:
          type: number
          format: double
          description: 'Slippage per trade as a fraction of trade value (default: 0.0005).'
          nullable: true
        strategy:
          type: string
          description: Strategy key, e.g. `"rsi_mean_rev"`. See `alm-strategy::catalog::STRATEGY_KEYS`.
        symbol:
          type: string
          description: Asset symbol, e.g. `"BTCUSDT"`.
        timeframe:
          type: string
          description: Timeframe subdirectory, e.g. `"H1"`, `"M1"`, `"D1"`.
          nullable: true
        to:
          type: string
          description: 'Date range end, inclusive. Format: `"YYYY-MM-DD"`.'
          nullable: true
        walk_forward:
          allOf:
          - $ref: '#/components/schemas/WalkForwardConfig'
          nullable: true
    BacktestResult:
      type: object
      description: Summary row written after each successful run. Full report pushed to S3.
      required:
      - id
      - case_id
      - ran_at
      - total_return_pct
      - sharpe_ratio
      - max_drawdown_pct
      - win_rate_pct
      - total_trades
      - created_at
      properties:
        case_id:
          type: string
        created_at:
          type: integer
          format: int64
        id:
          type: string
        max_drawdown_pct:
          type: number
          format: double
        ran_at:
          type: integer
          format: int64
        s3_key:
          type: string
          description: |-
            S3 / R2 object key for the full BacktestReport JSON.
            `None` when upload is disabled or failed.
          nullable: true
        sharpe_ratio:
          type: number
          format: double
        total_return_pct:
          type: number
          format: double
        total_trades:
          type: integer
          format: int64
        win_rate_pct:
          type: number
          format: double
    BarRecord:
      type: object
      description: Single OHLCV bar on the wire. Short field names to cut payload size.
      required:
      - t
      - o
      - h
      - l
      - c
      - v
      properties:
        c:
          type: number
          format: double
        h:
          type: number
          format: double
        l:
          type: number
          format: double
        n:
          type: integer
          format: int64
          nullable: true
        o:
          type: number
          format: double
        t:
          type: integer
          format: int64
          description: Unix milliseconds (UTC).
        v:
          type: number
          format: double
        vwap:
          type: number
          format: double
          nullable: true
    BarStreamEvent:
      type: object
      description: |-
        SSE bar event — OHLCV bar plus the current value of every requested indicator.

        `indicators` is keyed by label (or canonical key). Each value is a flat map of
        the indicator's output fields, e.g. `{"value": 94150.0}` for EMA or
        `{"upper": 94800.0, "mid": 94200.0, "lower": 93600.0}` for Bollinger Bands.
      required:
      - t
      - o
      - h
      - l
      - c
      - v
      properties:
        c:
          type: number
          format: double
        h:
          type: number
          format: double
        indicators:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: number
              format: double
        l:
          type: number
          format: double
        o:
          type: number
          format: double
        t:
          type: integer
          format: int64
        v:
          type: number
          format: double
    CandlesQuery:
      type: object
      description: Candle section controls of a unified request.
      properties:
        after:
          type: integer
          format: int64
          description: Bars with `t > after`, oldest-first. Unix milliseconds.
          nullable: true
        before:
          type: integer
          format: int64
          description: Bars with `t < before`, newest-first. Unix milliseconds.
          nullable: true
        limit:
          type: integer
          description: Max bars to return. Default 500, max 5000.
          nullable: true
          minimum: 0
    CandlesResult:
      type: object
      required:
      - count
      - bars
      properties:
        bars:
          type: array
          items:
            $ref: '#/components/schemas/BarRecord'
        count:
          type: integer
          minimum: 0
        next_after:
          type: integer
          format: int64
          nullable: true
        next_before:
          type: integer
          format: int64
          nullable: true
        truncated_below:
          type: boolean
    CreateCaseReq:
      type: object
      required:
      - label
      - strategy_id
      - symbol
      properties:
        capital:
          allOf:
          - $ref: '#/components/schemas/PositionConfig'
          nullable: true
        data_source:
          type: string
          nullable: true
        execution:
          allOf:
          - $ref: '#/components/schemas/ExecutionConfig'
          nullable: true
        from_ms:
          type: integer
          format: int64
          nullable: true
        label:
          type: string
        strategy_id:
          type: string
        symbol:
          type: string
        timeframe:
          type: string
          nullable: true
        to_ms:
          type: integer
          format: int64
          nullable: true
    CreateStrategyReq:
      type: object
      required:
      - name
      - label
      - strategy_spec
      properties:
        label:
          type: string
        name:
          type: string
        notes:
          type: string
          nullable: true
        previous_id:
          type: string
          description: UUID of the strategy version this is branched/updated from.
          nullable: true
        strategy_spec:
          $ref: '#/components/schemas/StrategySpec'
        version:
          type: integer
          format: int32
          description: If omitted, auto-incremented from the highest existing version for `name`.
          nullable: true
    CreateWatchReq:
      type: object
      required:
      - symbols
      - strategy_spec
      properties:
        nats_subject:
          type: string
          nullable: true
        strategy_spec:
          $ref: '#/components/schemas/StrategySpec'
        symbols:
          type: array
          items:
            type: string
        timeframe:
          type: string
          nullable: true
        webhook_url:
          type: string
          nullable: true
    DeclaredIndicator:
      type: object
      description: Per-line declared indicator summary returned in the lint scope.
      required:
      - name
      - ind_type
      - period
      properties:
        ind_type:
          type: string
        live:
          type: boolean
          description: '`true` if declared with `live_` prefix, e.g. `ind.rsi(5, "live_H1")`.'
        name:
          type: string
        period:
          type: integer
          minimum: 0
        timeframe:
          type: string
          description: Timeframe string if HTF, e.g. `"H1"`.
          nullable: true
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    ExecutionConfig:
      type: object
      properties:
        commission_pct:
          type: number
          format: double
          nullable: true
        intra_bar_mode:
          type: string
          description: '`"close_only"` (default) | `"pessimistic"` | `"ohlc_heuristic"`'
          nullable: true
        risk_free_annual:
          type: number
          format: double
          nullable: true
        slippage_pct:
          type: number
          format: double
          nullable: true
    IndicatorConfig:
      allOf:
      - type: object
        description: Passed verbatim to `IndicatorBox::from_config`. `"type"` is required.
      - type: object
        properties:
          label:
            type: string
            description: Override the key under which the series appears in the response.
            nullable: true
      description: |-
        Single indicator spec in a unified request. Flat form — anything the
        `alm_indicator::IndicatorBox::from_config` accepts, plus an optional
        `label` to override the response key.

        Example: `{"type":"ema","period":20}` or `{"type":"rsi","period":14,"label":"rsi14"}`.
    IndicatorPoint:
      allOf:
      - type: object
      - type: object
        required:
        - t
        properties:
          t:
            type: integer
            format: int64
      description: |-
        Individual indicator point in a series — `t` plus the indicator's fields.
        Kept flat so clients can address `row.value` / `row.macd` etc.
    IndicatorStatus:
      type: object
      description: Per-indicator warm-up status reported in the `status` SSE event.
      required:
      - ready
      - warm_estimate
      - bars_available
      - bars_needed
      properties:
        bars_available:
          type: integer
          description: Bars currently available in the ledger window.
          minimum: 0
        bars_needed:
          type: integer
          description: How many more bars are needed. 0 when ready.
          minimum: 0
        ready:
          type: boolean
          description: True when `ready_since_t` is set AND `bars_available >= warm_estimate`.
        warm_estimate:
          type: integer
          description: Estimated bars needed for stable convergence (EMA decay formula or exact period).
          minimum: 0
    LintDiagnostic:
      type: object
      description: A lint diagnostic with Monaco-compatible line/col coordinates (1-based).
      required:
      - line
      - col
      - message
      - severity
      properties:
        col:
          type: integer
          description: 1-based column number (0 = unknown).
          minimum: 0
        line:
          type: integer
          description: 1-based line number (0 = unknown / whole-script).
          minimum: 0
        message:
          type: string
        severity:
          type: string
          description: '`"error"` or `"warning"`.'
    MonteCarloConfig:
      type: object
      description: Monte Carlo bootstrap config.
      properties:
        n_iter:
          type: integer
          description: 'Bootstrap iterations (default: 1 000).'
          nullable: true
          minimum: 0
        ruin_threshold:
          type: number
          format: double
          description: 'Ruin floor as fraction of initial capital (default: 0.50).'
          nullable: true
        seed:
          type: integer
          format: int64
          description: RNG seed for reproducibility (`null` = time-based).
          nullable: true
          minimum: 0
    PositionConfig:
      type: object
      properties:
        initial:
          type: number
          format: double
          nullable: true
        max_positions:
          type: integer
          nullable: true
          minimum: 0
        position_pct:
          type: number
          format: double
          nullable: true
        position_usd:
          type: number
          format: double
          nullable: true
    ScriptBacktestRequest:
      type: object
      description: |-
        Dedicated request for script backtests.
        Takes a `script` field containing the full strategy script.

        Any `plot("name", value)` calls inside the script populate
        `indicator_series` in the response.

        Every request to this endpoint is persisted: strategy + case are created or
        updated before the engine runs, and the result is saved on completion.
        Use `case_id` to re-run an existing case (params may differ — the case row
        is updated in place). Omit `case_id` to open a new case.
      required:
      - symbol
      - script
      - name
      properties:
        asset_type:
          type: string
          nullable: true
        case_id:
          type: string
          description: Existing case ID to update and re-run. Omit to create a new case.
          nullable: true
        commission_pct:
          type: number
          format: double
          nullable: true
        data_source:
          type: string
          nullable: true
        from:
          type: string
          nullable: true
        initial_capital:
          type: number
          format: double
          nullable: true
        intra_bar_mode:
          type: string
          nullable: true
        label:
          type: string
          description: Human-readable case label. Defaults to `"{name} on {symbol}"` if omitted.
          nullable: true
        market_hours_only:
          type: boolean
          nullable: true
        max_positions:
          type: integer
          nullable: true
          minimum: 0
        monte_carlo:
          allOf:
          - $ref: '#/components/schemas/MonteCarloConfig'
          nullable: true
        name:
          type: string
          description: Strategy name (slug). Used to group versions; required for server-side runs.
        notes:
          type: string
          description: Optional change notes attached to the strategy version.
          nullable: true
        position_size_pct:
          type: number
          format: double
          nullable: true
        position_size_quantity:
          type: number
          format: double
          nullable: true
        position_size_usd:
          type: number
          format: double
          nullable: true
        risk_free_annual:
          type: number
          format: double
          nullable: true
        script:
          type: string
          description: Full strategy script.
        slippage_pct:
          type: number
          format: double
          nullable: true
        strategy_id:
          type: string
          description: |-
            ID of an existing strategy version to compare against.

            - Same script as that version → reuse it, open a new case.
            - Different script → create a new version with `previous_id = strategy_id`.

            When omitted, the server deduplicates by `spec_hash` across all versions
            of `name`; a new version is created only if no matching hash exists.
          nullable: true
        symbol:
          type: string
          description: Symbol to backtest, e.g. `"BTCUSDT"`.
        timeframe:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
        walk_forward:
          allOf:
          - $ref: '#/components/schemas/WalkForwardConfig'
          nullable: true
    ScriptLintScope:
      type: object
      description: Scope information for Monaco autocomplete / hover.
      required:
      - indicators
      - bar_fields
      - output_vars
      - functions
      properties:
        bar_fields:
          type: array
          items:
            type: string
        functions:
          type: array
          items:
            type: string
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/DeclaredIndicator'
        output_vars:
          type: array
          items:
            type: string
    ScriptValidateReq:
      type: object
      required:
      - script
      properties:
        script:
          type: string
          description: Full strategy script to lint.
    ScriptValidateResp:
      type: object
      required:
      - errors
      - scope
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/LintDiagnostic'
          description: List of diagnostics. Empty → script is clean.
        scope:
          $ref: '#/components/schemas/ScriptLintScope'
    SignalPoint:
      type: object
      description: One signal emitted during a signal-replay run.
      required:
      - ts
      - direction
      - strength
      properties:
        direction:
          type: string
          description: '`"long"`, `"short"`, or `"close"`.'
        is_offset:
          type: boolean
          description: True when `tp`/`sl` are offsets from fill price, not absolute prices.
        price:
          type: number
          format: double
          description: Bar close price at signal time.
          nullable: true
        reason:
          type: string
          description: Human-readable reason string for audit logs.
          nullable: true
        stop_price:
          type: number
          format: double
          description: Stop-loss price (from script `let sl = …`).
          nullable: true
        strength:
          type: number
          format: double
          description: Signal strength \[0, 1\].
        target_price:
          type: number
          format: double
          description: Take-profit price (from script `let tp = …`).
          nullable: true
        ts:
          type: integer
          format: int64
          description: Unix milliseconds of the bar that triggered this signal.
    Strategy:
      type: object
      description: |-
        A versioned strategy definition. Each (name, version) pair is immutable
        once created — create a new version to iterate on a spec.
      required:
      - id
      - name
      - version
      - label
      - strategy_spec
      - created_at
      properties:
        created_at:
          type: integer
          format: int64
        id:
          type: string
          description: UUID v7 — identifies this exact version.
        label:
          type: string
          description: Human-readable display label.
        name:
          type: string
          description: Stable slug that groups all versions of the same strategy.
        notes:
          type: string
          description: Optional change notes for this version.
          nullable: true
        previous_id:
          type: string
          description: UUID of the strategy version this was branched/updated from.
          nullable: true
        strategy_spec:
          $ref: '#/components/schemas/StrategySpec'
        version:
          type: integer
          format: int32
          description: User-assigned version number (1, 2, 3 …). Auto-incremented if omitted.
    StrategySpec:
      type: object
      description: |-
        A script strategy specification.

        JSON shape: `{ "script": "let rsi = ind.rsi(14); ..." }` — no `kind` discriminant needed.
        Legacy records that include `"kind": "script"` are deserialized correctly (unknown fields
        are ignored by serde).
      required:
      - script
      properties:
        script:
          type: string
    StreamRequest:
      type: object
      description: |-
        Request body for `POST /api/stream/:symbol`.

        Exactly one of `indicators` or `script` should be provided:
        - `indicators`: structured list of indicator configs (no computation)
        - `script`: script using `ind.TYPE(period)` + `plot("name", value)`
      properties:
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/IndicatorConfig'
          description: Structured indicator mode — returns raw cell values per bar.
          nullable: true
        script:
          type: string
          description: Script mode — script runs per bar, returns whatever was `plot()`-ed.
          nullable: true
        tf:
          type: string
          nullable: true
    StreamStatus:
      type: object
      description: First SSE event sent on every new stream connection.
      required:
      - bars_available
      - all_ready
      - indicators
      properties:
        all_ready:
          type: boolean
          description: True when every requested indicator passes its warm_estimate check.
        bars_available:
          type: integer
          minimum: 0
        indicators:
          type: object
          description: Keyed by var_name (script mode) or label (structured mode).
          additionalProperties:
            $ref: '#/components/schemas/IndicatorStatus'
    UnifiedDataRequest:
      type: object
      properties:
        candles:
          allOf:
          - $ref: '#/components/schemas/CandlesQuery'
          nullable: true
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/IndicatorConfig'
          nullable: true
        tf:
          type: string
          nullable: true
    UnifiedDataResponse:
      type: object
      required:
      - symbol
      - tf
      properties:
        candles:
          allOf:
          - $ref: '#/components/schemas/CandlesResult'
          nullable: true
        indicators:
          type: object
          description: Keyed by `label` or the indicator's canonical key when `label` is omitted.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/IndicatorPoint'
          nullable: true
        missing:
          type: array
          items:
            type: string
          description: |-
            Specs that were requested but could not be satisfied — bad config,
            missing `"type"`, exceeded `max_period`, etc. Empty on the happy path.
        symbol:
          type: string
        tf:
          type: string
    UpdateCaseReq:
      type: object
      properties:
        capital:
          allOf:
          - $ref: '#/components/schemas/PositionConfig'
          nullable: true
        data_source:
          type: string
          nullable: true
        execution:
          allOf:
          - $ref: '#/components/schemas/ExecutionConfig'
          nullable: true
        from_ms:
          type: integer
          format: int64
          nullable: true
        label:
          type: string
          nullable: true
        strategy_id:
          type: string
          nullable: true
        symbol:
          type: string
          nullable: true
        timeframe:
          type: string
          nullable: true
        to_ms:
          type: integer
          format: int64
          nullable: true
    UpdateStrategyReq:
      type: object
      description: Only label and notes are mutable on an existing version.
      properties:
        label:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
    WalkForwardConfig:
      type: object
      description: Walk-forward validation config.
      required:
      - is_bars
      - oos_bars
      properties:
        embargo_bars:
          type: integer
          nullable: true
          minimum: 0
        is_bars:
          type: integer
          minimum: 0
        min_oos_trades:
          type: integer
          nullable: true
          minimum: 0
        mode:
          type: string
          description: '`"rolling"` (default) | `"anchored"`.'
          nullable: true
        oos_bars:
          type: integer
          minimum: 0
        step_bars:
          type: integer
          nullable: true
          minimum: 0
    WatchEntry:
      type: object
      description: |-
        A registered watch — runs a strategy on live bars and dispatches
        signals to a webhook or NATS subject instead of executing trades.
      required:
      - id
      - symbols
      - strategy_spec
      - pinned_indicators
      - created_at
      properties:
        created_at:
          type: integer
          format: int64
        id:
          type: string
        nats_subject:
          type: string
          description: NATS subject to publish SignalMsg to (e.g. strategist subscribes).
          nullable: true
        pinned_indicators:
          type: integer
          description: |-
            Number of indicator handles pinned in the ledger by this entry.
            Informational — decrements to 0 when the entry is deleted.
          minimum: 0
        strategy_spec:
          $ref: '#/components/schemas/StrategySpec'
        symbols:
          type: array
          items:
            type: string
        timeframe:
          type: string
          nullable: true
        webhook_url:
          type: string
          description: HTTP endpoint to POST signal JSON to when strategy fires.
          nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT issued by the identity service. Pass as `Authorization: Bearer <token>`.'
security:
- bearerAuth: []
tags:
- name: live
  description: Live ledger data
- name: backtest
  description: Backtest execution
- name: strategy
  description: Saved strategies, cases, results
- name: watch
  description: Watchlist / warm-set management
- name: stream
  description: SSE real-time push
