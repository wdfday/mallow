root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/gateway ./cmd/gateway"
bin = "./tmp/gateway"
full_bin = "./tmp/gateway"
include_ext = ["go", "tpl", "tmpl", "html", "env"]
exclude_dir = ["tmp", "vendor", ".idea", ".git"]
exclude_regex = ["_test\\.go"]
delay = 200
stop_on_error = true
kill_delay = "300ms"
send_interrupt = true

[log]
time = true

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"

[misc]
clean_on_exit = true
