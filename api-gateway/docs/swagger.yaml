      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a helm
      tags:
      - Helm
    put:
      consumes:
      - application/json
      parameters:
      - description: Helm ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated config
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update helm config
      tags:
      - Helm
  /api/v1/helms/{id}/disable:
    post:
      parameters:
      - description: Helm ID
        in: path
        name: id
        required: true
