      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Stop a hand
      tags:
      - Helm
  /api/v1/helms:
    get:
      description: Returns all Helm accounts accessible to the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: List helms
      tags:
      - Helm
  /api/v1/helms/{id}:
    get:
      parameters:
      - description: Helm ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
