basePath: /
definitions:
  handler.BacktestEstimateRequest:
    properties:
      from_time:
        example: "2024-01-01T00:00:00Z"
        type: string
      strategy:
        example: RSIStrategy
        type: string
      symbol:
        example: BTCUSDT
        type: string
      timeframe:
        example: M1
        type: string
      to_time:
        example: "2024-12-31T23:59:59Z"
        type: string
    type: object
  handler.BacktestRequest:
    properties:
      commission_pct:
        example: 0.001
        type: number
      from_time:
        example: "2024-01-01T00:00:00Z"
        type: string
      initial_capital:
        example: 10000
        type: number
      lot_size:
        example: 0
        type: number
      params:
        additionalProperties: true
        type: object
      script:
        example: // strategy script
        type: string
      slippage_pct:
        example: 0
        type: number
      strategy:
        example: RSIStrategy
        type: string
      symbol:
        example: BTCUSDT
        type: string
      timeframe:
        example: M1
        type: string
      to_time:
        example: "2024-12-31T23:59:59Z"
        type: string
    type: object
  handler.DataQueryRequest:
    properties:
      from:
        example: "2024-01-01T00:00:00Z"
        type: string
      indicators:
        items:
          additionalProperties: true
          type: object
        type: array
      limit:
        example: 500
        type: integer
      to:
        example: "2024-12-31T23:59:59Z"
        type: string
    type: object
  handler.StreamRequest:
    properties:
      indicators:
        items:
          additionalProperties: true
          type: object
        type: array
      script:
        type: string
      timeframe:
        example: M1
        type: string
    type: object
info:
  contact: {}
  description: |-
    Gateway for Mallow algorithmic trading system.

    All protected routes require a Bearer JWT token obtained from the Identity service (`/api/v1/auth/login`).
  title: Mallow API Gateway
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email + password. Returns access and refresh
        tokens.
      parameters:
      - description: '{ \'
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Login (get JWT)
      tags:
      - Identity
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: '{ \'
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Refresh access token
      tags:
      - Identity
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - Identity
  /api/v1/backtest:
    post:
      consumes:
      - application/json
      description: Executes a named strategy backtest over a historical date range.
        Returns a BacktestReport with Sharpe, Sortino, Calmar, max drawdown, win rate,
        profit factor, and trade list.
      parameters:
      - description: Backtest parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.BacktestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Run a backtest
      tags:
      - Herald
  /api/v1/backtest/estimate:
    post:
      consumes:
      - application/json
      description: Returns estimated bar count and time without running the full engine.
      parameters:
      - description: Estimate parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.BacktestEstimateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Estimate backtest cost
      tags:
      - Herald
  /api/v1/backtest/script:
    post:
      consumes:
      - application/json
      description: Executes a script strategy. Always saves the script version and
        result to the store. Pass strategy_id to link to an existing version chain.
      parameters:
      - description: Script backtest parameters (use 'script' field)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.BacktestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Run a script backtest
      tags:
      - Herald
  /api/v1/data/{symbol}:
    get:
      description: Returns the most recent bar and live indicator snapshot for a symbol.
      parameters:
      - description: Symbol, e.g. BTCUSDT
        in: path
        name: symbol
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Latest OHLCV bar
      tags:
      - Herald
    post:
      consumes:
      - application/json
      description: Returns historical bars with optional indicator overlay. Falls
        back to DuckDB Parquet when the requested range predates the live ledger window.
      parameters:
      - description: Symbol, e.g. BTCUSDT
        in: path
        name: symbol
        required: true
        type: string
      - description: Query parameters
        in: body
        name: body
        schema:
          $ref: '#/definitions/handler.DataQueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Query OHLCV bars + indicators
      tags:
      - Herald
  /api/v1/data/{symbol}/latest:
    get:
      description: Alias for GET /api/v1/data/:symbol.
      parameters:
      - description: Symbol
        in: path
        name: symbol
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Latest OHLCV bar (alias)
      tags:
      - Herald
  /api/v1/data/duckdb:
    post:
      consumes:
      - application/json
      description: Run a raw Parquet query via DuckDB on historical data.
      parameters:
      - description: DuckDB query payload
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: DuckDB Parquet query
      tags:
      - Herald
  /api/v1/hands:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: List hands
      tags:
      - Helm
    post:
      consumes:
      - application/json
      description: Creates a new signal-following bot under a helm. The hand starts
        stopped; call /start to activate.
      parameters:
      - description: Hand config
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a hand (autonomous bot)
      tags:
      - Helm
  /api/v1/hands/{id}:
    delete:
      parameters:
      - description: Hand ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a hand
      tags:
      - Helm
    get:
      parameters:
      - description: Hand ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a hand
      tags:
      - Helm
    put:
      consumes:
      - application/json
      parameters:
      - description: Hand ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated config
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update hand config
      tags:
      - Helm
  /api/v1/hands/{id}/kill:
    post:
      description: Stops the hand and flattens its positions at the exchange.
      parameters:
      - description: Hand ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Kill a hand (flatten positions)
      tags:
      - Helm
  /api/v1/hands/{id}/pause:
    post:
      parameters:
      - description: Hand ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Pause a hand
      tags:
      - Helm
  /api/v1/hands/{id}/release:
    post:
      description: Stops the hand without flattening positions. Emits position_orphaned
        poslog events.
      parameters:
      - description: Hand ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Release a hand (leave positions live)
      tags:
      - Helm
  /api/v1/hands/{id}/restart:
    post:
      parameters:
      - description: Hand ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Restart a hand
      tags:
      - Helm
  /api/v1/hands/{id}/resume:
    post:
      parameters:
      - description: Hand ID
        in: path
        name: id
        required: true
        type: string
      produces:
