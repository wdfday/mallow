      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Resume a paused hand
      tags:
      - Helm
  /api/v1/hands/{id}/start:
    post:
      parameters:
      - description: Hand ID
        in: path
        name: id
        required: true
        type: string
      produces:
