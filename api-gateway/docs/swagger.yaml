      security:
      - BearerAuth: []
      summary: Reset a halted helm
      tags:
      - Helm
  /api/v1/helms/{id}/kill:
    post:
      description: Stops all hands and flattens their positions at the exchange. Sets
        helm state to halted.
      parameters:
      - description: Helm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Kill a helm (flatten all positions)
      tags:
      - Helm
  /api/v1/helms/{id}/orders:
    get:
      parameters:
