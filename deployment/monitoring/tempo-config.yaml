server:
  http_listen_port: 3200

# ── Distributor: receive OTLP traces ─────────────────────────────────────────
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

# ── Storage ───────────────────────────────────────────────────────────────────
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    block:
      bloom_filter_false_positive: 0.05
      v2_index_downsample_bytes: 1000
      v2_encoding: zstd

# ── Compactor ─────────────────────────────────────────────────────────────────
compactor:
  compaction:
    block_retention: 48h

# ── Ingester ──────────────────────────────────────────────────────────────────
ingester:
  max_block_duration: 5m

# ── Metrics generator (span metrics → Prometheus) ────────────────────────────
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: mallow
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

# ── Per-tenant overrides ──────────────────────────────────────────────────────
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
      generate_native_histograms: both
