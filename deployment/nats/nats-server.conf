# NATS server config — Mallow Trading System
# Transport-level auth: each service has a username+password and is restricted
# to the subjects it legitimately pub/sub. This prevents a compromised service
# from publishing to subjects it doesn't own.
#
# For production, replace username/password with NKeys or operator JWT credentials.

port: 4222
http_port: 8222

websocket {
  port: 9222
  no_tls: true
  no_auth_user: nats_ui
}

jetstream {
  store_dir: /data
  max_file_store:   10GB
  max_memory_store: 512MB
}

authorization {
  # ── Herald (WebSocket ingester + signal engine + backtest API) ────────
  # Publishes live bars and signals; subscribes to engine control subjects
  # for bot registration / strategy configuration.
  signal_engine: {
    publish:   ["bars.>", "signals", "$JS.API.>", "_INBOX.>"]
    subscribe: [
      "bars.>",
      "engine.configure", "engine.reset",
      "engine.register", "engine.deregister", "engine.list",
      "_INBOX.>"
    ]
  }

  # ── Orchestration ────────────────────────────────────────────────────
  orchestrator: {
    publish:   [
      "engine.configure", "engine.reset",
      "engine.register", "engine.deregister", "engine.list",
      "orchestrator.>",
      "trade.filled.>",
      "portfolio.synced.>",
      "investment.transactions.>",
      "$JS.API.>", "_INBOX.>"
    ]
    subscribe: [
      "ticks.>",
      "signals",
      "orchestrator.>",
      "_INBOX.>"
    ]
  }

  # ── Investment (JetStream consumer + portfolio sync subscriber) ──────
  investment: {
    publish:   [
      "orchestrator.accounts.linked",
      "orchestrator.accounts.unlinked",
      "$JS.API.>", "_INBOX.>"
    ]
    subscribe: ["investment.transactions.>", "portfolio.synced.>", "ticks.>", "_INBOX.>"]
  }

  # ── AI / strategist ──────────────────────────────────────────────────
  strategist: {
    publish:   ["orchestrator.>", "$JS.API.>", "_INBOX.>"]
    subscribe: ["signals", "orchestrator.>", "user.telegram.>", "_INBOX.>"]
  }

  # ── API gateway ──────────────────────────────────────────────────────
  gateway: {
    publish:   ["_INBOX.>"]
    subscribe: ["_INBOX.>"]
  }

  # ── Identity (email jobs, telegram events, user lifecycle) ────────────
  identity: {
    publish:   ["mail.>", "identity.>", "user.>", "$JS.API.>", "_INBOX.>"]
    subscribe: ["mail.>", "identity.>", "_INBOX.>"]
  }

  # ── Surveyor (monitoring — read-only system account) ─────────────────
  surveyor: {
    publish:   ["$SYS.REQ.>", "$JS.API.>", "$SRV.>", "_INBOX.>"]
    subscribe: [">"]
  }

  # ── nats-ui (WebSocket no-auth — subscribe only, local dev) ──────────
  nats_ui: {
    publish:   []
    subscribe: [">"]
  }

  users: [
    { user: signal_engine, password: $NATS_PASS_SIGNAL_ENGINE,  permissions: $signal_engine }
    { user: orchestrator,  password: $NATS_PASS_ORCHESTRATOR,   permissions: $orchestrator  }
    { user: investment,    password: $NATS_PASS_INVESTMENT,     permissions: $investment    }
    { user: strategist,    password: $NATS_PASS_STRATEGIST,     permissions: $strategist    }
    { user: gateway,       password: $NATS_PASS_GATEWAY,        permissions: $gateway       }
    { user: identity,      password: $NATS_PASS_IDENTITY,       permissions: $identity      }
    { user: surveyor,      password: $NATS_PASS_SURVEYOR,       permissions: $surveyor      }
    { user: nats_ui,       password: "",                        permissions: $nats_ui       }
  ]
}
