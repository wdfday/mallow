# NATS server config — Mallow Trading System
# Transport-level auth: each service has a username+password and is restricted
# to the subjects it legitimately pub/sub. This prevents a compromised service
# from publishing to subjects it doesn't own.
#
# For production, replace username/password with NKeys or operator JWT credentials.

port: 4222
http_port: 8222

websocket {
  port: 9222
  no_tls: true
  no_auth_user: nats_ui
}

jetstream {
  store_dir: /data
  max_file_store:   10GB
  max_memory_store: 512MB
}

authorization {
  # ── Herald (WebSocket ingester + signal engine + backtest API) ────────
  # Publishes live bars, signals, and engine.ready on startup.
  # Subscribes to engine control subjects for hand registration / heartbeat.
  # Subscribes to signals.query.> and bars.query.> for strategist req/rep.
  signal_engine: {
    publish:   ["bars.>", "signals", "engine.ready", "$JS.API.>", "_INBOX.>"]
    subscribe: [
      "bars.>",
      "engine.reset",
      "engine.register", "engine.deregister", "engine.list",
      "engine.ping", "engine.heartbeat",
      "signals.query.>", "bars.query.>",
      "herald.stats",
      "_INBOX.>"
    ]
  }

  # ── Helm (trade execution — manages hands) ───────────────────────────
  helm: {
    publish:   [
      "engine.reset",
      "engine.register", "engine.deregister", "engine.list",
      "engine.ping", "engine.heartbeat",
      "helm.>",
      "trade.filled.>",
      "portfolio.synced.>",
      "$JS.API.>", "$JS.ACK.>", "_INBOX.>"
    ]
    subscribe: [
      "signals",
      "engine.ready",
      "helm.>",
      "_INBOX.>"
    ]
  }

  # ── AI / strategist ──────────────────────────────────────────────────
  strategist: {
    publish:   [
      "helm.>",
      "herald.stats",
      "signals.query.>", "bars.query.>",
      "$JS.API.>", "$JS.ACK.>", "_INBOX.>"
    ]
    subscribe: ["signals", "helm.>", "user.telegram.>", "_INBOX.>"]
  }

  # ── API gateway ──────────────────────────────────────────────────────
  # Realtime WebSocket fan-out (/api/v1/stream): the gateway subscribes market
  # bars + scoped account streams and resolves user scope via helm.helms.list.
  gateway: {
    publish:   [
      "helm.helms.list",   # resolve user scope (req/rep)
      "$JS.API.>",         # JetStream consumer create/delete for account channels
      "_INBOX.>"
    ]
    subscribe: [
      "bars.>",            # market: bars.{sym} + forming bars.live.{sym}
      "helm.events.>",     # account: helm activity feed
      "trade.filled.>",    # account: fills
      "portfolio.synced.>",# account: portfolio sync
      "helm.equity.>",     # account: equity snapshots
      "helm.pos.>",        # account: position log
      "_INBOX.>"
    ]
  }

  # ── Identity (email jobs, telegram events, user lifecycle) ────────────
  identity: {
    publish:   ["mail.>", "identity.>", "user.>", "$JS.API.>", "_INBOX.>"]
    subscribe: ["mail.>", "identity.>", "_INBOX.>"]
  }

  # ── Surveyor (monitoring — read-only system account) ─────────────────
  surveyor: {
    publish:   ["$SYS.REQ.>", "$JS.API.>", "$SRV.>", "_INBOX.>"]
    subscribe: [">"]
  }

  # ── nats-ui (WebSocket no-auth — subscribe only, local dev) ──────────
  nats_ui: {
    publish:   []
    subscribe: [">"]
  }

  users: [
    { user: signal_engine, password: $NATS_PASS_SIGNAL_ENGINE,  permissions: $signal_engine }
    { user: helm,          password: $NATS_PASS_HELM,           permissions: $helm          }
    { user: strategist,    password: $NATS_PASS_STRATEGIST,     permissions: $strategist    }
    { user: gateway,       password: $NATS_PASS_GATEWAY,        permissions: $gateway       }
    { user: identity,      password: $NATS_PASS_IDENTITY,       permissions: $identity      }
    { user: surveyor,      password: $NATS_PASS_SURVEYOR,       permissions: $surveyor      }
    { user: nats_ui,       password: "",                        permissions: $nats_ui       }
  ]
}
