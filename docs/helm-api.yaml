basePath: /
definitions:
  mallow_helm_internal_module_hand_domain.ExitConfig:
    properties:
      max_bars:
        description: 'time-stop: close after N bars'
        type: integer
      sl:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.ExitLevel'
        description: stop-loss
      tp:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.ExitLevel'
        description: take-profit
    type: object
  mallow_helm_internal_module_hand_domain.ExitLevel:
    properties:
      expr:
        description: non-nil when ATR expression
        type: string
      pct:
        description: non-nil when fixed fraction
        type: number
    type: object
  mallow_helm_internal_module_hand_domain.HandHealthView:
    properties:
      last_error:
        type: string
      last_error_at:
        type: string
      last_order_at:
        type: string
      last_signal_at:
        type: string
      started_at:
        type: string
      status:
        type: string
      uptime:
        type: string
    type: object
  mallow_helm_internal_module_hand_domain.HandMetricsView:
    properties:
      loss_count:
        type: integer
      orders_failed:
        type: integer
      orders_filled:
        type: integer
      orders_placed:
        type: integer
      signals_filtered:
        type: integer
      signals_received:
        type: integer
      total_pnl:
        type: number
      trades_approved:
        type: integer
      win_count:
        type: integer
    type: object
  mallow_helm_internal_module_hand_domain.HandRiskConfig:
    properties:
      exit:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.ExitConfig'
        description: |-
          Exit rules — mirrors almanac's ExitConfig for backtest/live parity.
          sl/tp: fixed fraction (0.05) or ATR expression ("2*atr", "1.5*atr(21)").
      trailing_stop_pct:
        description: TrailingStopPct is live-only (not in backtest ExitConfig).
        type: number
    type: object
  mallow_helm_internal_module_hand_domain.HandSummary:
    properties:
      created_at:
        type: string
      health:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandHealthView'
      helm_id:
        type: string
      id:
        type: string
      market:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.MarketType'
      metrics:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandMetricsView'
      name:
        type: string
      order_count:
        type: integer
      position:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.PositionConfig'
      risk:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandRiskConfig'
      running:
        type: boolean
      status:
        type: string
      strategy:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.StrategySpec'
      symbols:
        items:
          type: string
        type: array
      type:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandType'
    type: object
  mallow_helm_internal_module_hand_domain.HandType:
    enum:
    - signal_follower
    - manual
    - dca
    - grid
    type: string
    x-enum-varnames:
    - HandTypeSignalFollower
    - HandTypeManual
    - HandTypeDCA
    - HandTypeGrid
  mallow_helm_internal_module_hand_domain.MarketType:
    enum:
    - spot
    - futures
    type: string
    x-enum-varnames:
    - MarketTypeSpot
    - MarketTypeFutures
  mallow_helm_internal_module_hand_domain.PositionConfig:
    properties:
      allocated_capital:
        description: |-
          Capital slice for this hand.
          AllocatedCapital (fixed USDT) takes priority over AllocatedPct.
        type: number
      allocated_pct:
        description: 0.20 = 20%
        type: number
      fixed_qty:
        description: Fixed qty mode — overrides USD/pct sizing.
        type: number
      max_position_pct:
        description: legacy fallback
        type: number
      max_units:
        description: |-
          MaxUnits is the maximum number of concurrent entry legs.
          1 = no scaling (default). Each new entry signal while at max is rejected.
          Overridden downward by helm-level RiskConfig.MaxUnitsPerHand if set.
        type: integer
      pyramid:
        description: |-
          Pyramid controls how additional entry signals are handled while a position is open.
          true  → merge into the existing leg: qty accumulates, avg_entry recalculated,
                  SL/TP replaced with values from the latest signal.
          false → open a new independent leg with its own SL/TP (up to MaxUnits).
        type: boolean
      risk_per_trade_pct:
        description: for volatility mode
        type: number
      size_mode:
        description: Sizing algorithm.
        type: string
      unit_capital:
        description: |-
          Per-trade unit.
          UnitCapital (fixed USDT) takes priority over UnitPct.
        type: number
      unit_pct:
        description: 0.10 = 10% of allocated
        type: number
    type: object
  mallow_helm_internal_module_hand_domain.StrategySpec:
    properties:
      candle_type:
        description: |-
          CandleType controls the bar transform applied before indicators:
            ""              / "raw"         — standard OHLCV (default)
            "heiken_ashi"   / "ha"          — Heikin Ashi
            "smooth_ha"                     — EMA-smoothed Heikin Ashi (see SmoothPeriod)
        type: string
      min_strength:
        description: Signal strength filter [0–1]
        type: number
      script:
        description: Rhai script — full Rhai source code (required)
        type: string
      smooth_period:
        description: |-
          SmoothPeriod is the EMA period for "smooth_ha" mode (default 3, min 2).
          Ignored for other candle types.
        type: integer
      timeframe:
        description: |-
          Timeframe the script operates on (e.g. "M1", "M5", "H1", "D1").
          Defaults to "M1" via HandConfig.Defaults().
        type: string
    type: object
  mallow_helm_internal_module_hand_dto.CreateHandReq:
    properties:
      account_id:
        type: string
      futures:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.FuturesDTO'
      helm_id:
        type: string
      market:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.MarketType'
        enum:
        - spot
        - futures
      name:
        maxLength: 128
        minLength: 1
        type: string
      position:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.PositionDTO'
      risk:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.HandRiskConfigDTO'
      strategy:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.StrategyDTO'
      symbols:
        items:
          type: string
        minItems: 1
        type: array
      type:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandType'
        enum:
        - signal_follower
        - manual
        - dca
        - grid
    required:
    - name
    - strategy
    - symbols
    type: object
  mallow_helm_internal_module_hand_dto.FuturesDTO:
    properties:
      leverage:
        maximum: 125
        minimum: 1
        type: integer
      margin_type:
        enum:
        - isolated
        - cross
        type: string
    type: object
  mallow_helm_internal_module_hand_dto.HandActionResp:
    properties:
      id:
        type: string
      status:
        type: string
    type: object
  mallow_helm_internal_module_hand_dto.HandRiskConfigDTO:
    properties:
      exit:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.ExitConfig'
      trailing_stop_pct:
        maximum: 1
        type: number
    type: object
  mallow_helm_internal_module_hand_dto.PositionDTO:
    properties:
      allocated_capital:
        minimum: 0
        type: number
      allocated_pct:
        maximum: 1
        type: number
      fixed_qty:
        type: number
      max_position_pct:
        maximum: 1
        type: number
      max_units:
        minimum: 1
        type: integer
      pyramid:
        type: boolean
      risk_per_trade_pct:
        maximum: 1
        type: number
      size_mode:
        enum:
        - fixed_fractional
        - fixed_qty
        - percent_equity
        - volatility
        type: string
      unit_capital:
        minimum: 0
        type: number
      unit_pct:
        maximum: 1
        type: number
    type: object
  mallow_helm_internal_module_hand_dto.StrategyDTO:
    properties:
      candle_type:
        description: |-
          CandleType controls the bar transform applied before indicators:
            ""              / "raw"         — standard OHLCV (default)
            "heiken_ashi"   / "ha"          — Heikin Ashi
            "smooth_ha"                     — EMA-smoothed Heikin Ashi (see SmoothPeriod)
        type: string
      min_strength:
        description: Signal strength filter [0–1]
        type: number
      script:
        description: Rhai script — full Rhai source code (required)
        type: string
      smooth_period:
        description: |-
          SmoothPeriod is the EMA period for "smooth_ha" mode (default 3, min 2).
          Ignored for other candle types.
        type: integer
      timeframe:
        description: |-
          Timeframe the script operates on (e.g. "M1", "M5", "H1", "D1").
          Defaults to "M1" via HandConfig.Defaults().
        type: string
    type: object
  mallow_helm_internal_module_hand_dto.UpdateHandReq:
    properties:
      name:
        maxLength: 128
        minLength: 1
        type: string
      position:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.PositionDTO'
      risk:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.HandRiskConfigDTO'
    type: object
  mallow_helm_internal_module_helm_dto.ActionResp:
    properties:
      id:
        type: string
      status:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.ExchangeAccountResp:
    properties:
      cash:
        type: number
      equity:
        type: number
      positions:
        items:
          $ref: '#/definitions/mallow_helm_internal_module_helm_dto.ExchangePositionResp'
        type: array
    type: object
  mallow_helm_internal_module_helm_dto.ExchangeConfigResp:
    properties:
      base_url:
        type: string
      broker_type:
        type: string
      demo:
        type: boolean
      testnet:
        type: boolean
    type: object
  mallow_helm_internal_module_helm_dto.ExchangeOrderResp:
    properties:
      filled_avg_price:
        type: number
      filled_qty:
        type: number
      id:
        type: string
      qty:
        type: number
      side:
        type: string
      status:
        type: string
      symbol:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.ExchangePositionResp:
    properties:
      avg_price:
        type: number
      cur_price:
        type: number
      qty:
        type: number
      symbol:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.ExchangePriceResp:
    properties:
      price:
        type: number
      symbol:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.HelmDetailResp:
    properties:
      account_id:
        type: string
      capital:
        type: number
      created_at:
        type: string
      enabled:
        type: boolean
      exchange:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.ExchangeConfigResp'
      hands:
        items:
          $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandSummary'
        type: array
      id:
        type: string
      last_sync_at:
        type: string
      name:
        type: string
      paused:
        type: boolean
      portfolio:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.PortfolioConfigDTO'
      risk:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.RiskConfigDTO'
      running:
        type: boolean
      status:
        type: string
      updated_at:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.HelmResp:
    properties:
      account_id:
        type: string
      capital:
        type: number
      created_at:
        type: string
      enabled:
        type: boolean
      exchange:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.ExchangeConfigResp'
      id:
        type: string
      name:
        type: string
      portfolio:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.PortfolioConfigDTO'
      risk:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.RiskConfigDTO'
      status:
        type: string
      updated_at:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.OrderResp:
    properties:
      filled_avg_price:
        type: number
      filled_qty:
        type: number
      hand_id:
        type: string
      helm_id:
        type: string
      id:
        type: string
      qty:
        type: number
      side:
        type: string
      status:
        type: string
      submitted_at:
        type: string
      symbol:
        type: string
      type:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.PlaceExchangeOrderReq:
    properties:
      price:
        type: number
      qty:
        type: number
      side:
        enum:
        - buy
        - sell
        type: string
      symbol:
        type: string
      type:
        enum:
        - market
        - limit
        type: string
    required:
