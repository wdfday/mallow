        type: array
      detail:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
  mallow_helm_internal_shared.SuccessResponse-mallow_helm_internal_module_hand_domain_HandSummary:
    properties:
      data:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandSummary'
      detail:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
  mallow_helm_internal_shared.SuccessResponse-mallow_helm_internal_module_hand_dto_HandActionResp:
    properties:
