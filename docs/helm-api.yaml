    type: object
  mallow_helm_internal_module_helm_dto.TradeResp:
    properties:
      entry_price:
        type: number
      entry_time:
        type: string
      exit_price:
        type: number
      exit_time:
        type: string
      pnl:
        type: number
      pnl_pct:
        type: number
      qty:
        type: number
      side:
        type: string
      symbol:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.UpdateHelmReq:
    properties:
      capital:
        type: number
      name:
        maxLength: 128
        minLength: 1
        type: string
      portfolio:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.PortfolioConfigDTO'
      risk:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.RiskConfigDTO'
    type: object
  mallow_helm_internal_shared.ErrorResponse:
    properties:
      code:
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        type: string
      status:
        type: integer
    type: object
  mallow_helm_internal_shared.SuccessResponse-any:
    properties:
      data: {}
