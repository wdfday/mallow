info:
  contact: {}
  description: Helm service APIs for helms, hands, and signal engine control.
  title: Helm Service API
  version: "1.0"
paths:
  /api/v1/hands:
    get:
      parameters:
      - description: Filter by helm ID
        in: query
        name: helm_id
        type: string
      - description: Filter by account ID
        in: query
        name: account_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.SuccessResponse-array_mallow_helm_internal_module_hand_domain_HandSummary'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List hands
      tags:
      - hands
    post:
      consumes:
      - application/json
      parameters:
      - description: Hand create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/mallow_helm_internal_module_hand_dto.CreateHandReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.SuccessResponse-mallow_helm_internal_module_hand_domain_HandSummary'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create hand
      tags:
      - hands
  /api/v1/hands/{id}:
    delete:
      parameters:
      - description: Hand ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.SuccessResponse-mallow_helm_internal_module_hand_dto_HandActionResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "403":
