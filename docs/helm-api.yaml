          $ref: '#/definitions/mallow_helm_internal_module_helm_dto.OrderResp'
        type: array
      detail:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
  mallow_helm_internal_shared.SuccessResponse-array_mallow_helm_internal_module_helm_dto_PositionResp:
    properties:
      data:
        items:
          $ref: '#/definitions/mallow_helm_internal_module_helm_dto.PositionResp'
        type: array
      detail:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
  mallow_helm_internal_shared.SuccessResponse-array_mallow_helm_internal_module_helm_dto_TradeResp:
    properties:
      data:
        items:
