    - side
    - symbol
    - type
    type: object
  mallow_helm_internal_module_helm_dto.PortfolioConfigDTO:
    properties:
      max_position_pct:
        maximum: 1
        type: number
      max_positions:
        minimum: 1
        type: integer
      reserve_ratio:
        minimum: 0
        type: number
    type: object
  mallow_helm_internal_module_helm_dto.PortfolioResp:
    properties:
      cash:
        type: number
      current_drawdown_pct:
        type: number
      daily_pnl:
        type: number
      equity:
        type: number
      initial_capital:
        type: number
      max_drawdown_pct:
        type: number
      open_positions:
        type: integer
      positions:
        items:
          $ref: '#/definitions/mallow_helm_internal_module_helm_dto.PositionResp'
        type: array
      total_return_pct:
        type: number
      total_trades:
        type: integer
      win_rate_pct:
        type: number
