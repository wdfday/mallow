info:
  contact: {}
  description: Investment service APIs for accounts, broker connections, portfolio,
    transactions, and more.
  title: Investment Service API
  version: "1.0"
paths:
  /api/v1/investment/accounts:
    get:
      consumes:
        - application/json
      description: Get all accounts for the authenticated user with optional filters
      parameters:
        - description: Filter by account type
          enum:
            - spot
            - futures_usdm
            - futures_coinm
            - unified
            - options
          in: query
          name: account_type
          type: string
        - description: Filter by active status
          in: query
          name: is_active
          type: boolean
        - description: Include deleted accounts
          in: query
          name: include_deleted
          type: boolean
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.SuccessResponse-mallow_investment_internal_module_account_dto_AccountsListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
      security:
        - BearerAuth: []
      summary: Get my accounts
      tags:
        - accounts
  /api/v1/investment/accounts/{id}:
    get:
      consumes:
        - application/json
      description: Get a specific account by ID (must belong to authenticated user)
      parameters:
        - description: Account ID (UUID)
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.SuccessResponse-mallow_investment_internal_module_account_dto_AccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
      security:
        - BearerAuth: []
      summary: Get account by ID
      tags:
        - accounts
  /api/v1/investment/admin/rebuild:
    post:
      consumes:
        - application/json
      description: Rebuild read-model projections for a single investment account
      parameters:
        - description: Rebuild request
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/mallow_investment_internal_module_portfolio_replay_dto.RebuildRequest'
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.SuccessResponse-mallow_investment_internal_module_portfolio_replay_dto_RebuildResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
      security:
        - BearerAuth: []
      summary: Rebuild projections
      tags:
        - admin
  /api/v1/investment/broker-connections:
    get:
      consumes:
        - application/json
      description: Get broker connections for the authenticated user
      parameters:
        - description: Broker type
          in: query
          name: broker_type
          type: string
        - description: Connection status
          in: query
          name: status
          type: string
        - description: Only return auto-sync connections
          in: query
          name: auto_sync_only
          type: boolean
        - description: Only return active connections
          in: query
          name: active_only
          type: boolean
        - description: Only return connections needing sync
          in: query
          name: needing_sync_only
          type: boolean
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.SuccessResponse-mallow_investment_internal_module_broker_dto_BrokerConnectionListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
      security:
        - BearerAuth: []
      summary: List broker connections
      tags:
        - broker-connections
  /api/v1/investment/broker-connections/{id}:
    delete:
      consumes:
        - application/json
      description: Delete a broker connection for the authenticated user
      parameters:
        - description: Connection ID
          in: path
          name: id
          required: true
          type: string
      produces:
