      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
      security:
        - BearerAuth: []
      summary: Delete broker connection
      tags:
        - broker-connections
    get:
      consumes:
        - application/json
      description: Get a broker connection by ID for the authenticated user
      parameters:
        - description: Connection ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.SuccessResponse-mallow_investment_internal_module_broker_dto_BrokerConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.ErrorResponse'
      security:
        - BearerAuth: []
      summary: Get broker connection
      tags:
        - broker-connections
    put:
      consumes:
        - application/json
      description: Update a broker connection for the authenticated user
      parameters:
        - description: Connection ID
          in: path
          name: id
          required: true
          type: string
        - description: Broker connection update payload
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/mallow_investment_internal_module_broker_dto.UpdateBrokerConnectionRequest'
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_investment_internal_shared.SuccessResponse-mallow_investment_internal_module_broker_dto_BrokerConnectionResponse'
        "400":
