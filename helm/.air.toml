root = "."
tmp_dir = "tmp"

[build]
cmd = "mkdir -p ./tmp/gocache ./tmp/gotmp && GOCACHE=$(pwd)/tmp/gocache GOTMPDIR=$(pwd)/tmp/gotmp go build -o ./tmp/helm ./cmd/helm"
bin = "./tmp/helm"
full_bin = "GOCACHE=$(pwd)/tmp/gocache GOTMPDIR=$(pwd)/tmp/gotmp ./tmp/helm"
include_ext = ["go", "tpl", "tmpl", "html", "env"]
exclude_dir = ["tmp", "vendor", ".idea", ".git", "docs"]
exclude_regex = ["_test\\.go"]
delay = 200
stop_on_error = true
kill_delay = "300ms"
send_interrupt = true

[log]
time = true

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"

[misc]
clean_on_exit = true
