basePath: /
definitions:
  internal_module_hand_handler.HandEquityPoint:
    properties:
      cum_net_pnl:
        type: number
      cum_pnl:
        type: number
      ts:
        type: string
    type: object
  mallow_helm_internal_infra_journal_eventlog.EventRecord:
    properties:
      at:
        type: string
      code:
        type: integer
      direction:
        type: string
      hand_id:
        type: string
      helm_id:
        type: string
      id:
        type: integer
      msg:
        type: string
      order_id:
        type: string
      price:
        type: number
      qty:
        type: number
      reason:
        type: string
      side:
        type: string
      symbol:
        type: string
      user_id:
        type: string
    type: object
  mallow_helm_internal_module_account_dto.AccountResponse:
    properties:
      account_name:
        type: string
      account_type:
        type: string
      broker_connection_id:
        type: string
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      include_in_net_worth:
        type: boolean
      institution_name:
        type: string
      is_active:
        type: boolean
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  mallow_helm_internal_module_account_dto.AccountsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/mallow_helm_internal_module_account_dto.AccountResponse'
        type: array
      total:
        type: integer
    type: object
  mallow_helm_internal_module_hand_domain.FuturesConfig:
    properties:
      leverage:
        description: e.g. 10 for 10x; 1 = no leverage
        type: integer
      margin_type:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.MarginType'
        description: '"isolated" | "cross"'
    type: object
  mallow_helm_internal_module_hand_domain.HandGuardConfig:
    properties:
      max_avg_loss_pct:
        description: |-
          MaxAvgLossPct auto-stops the hand when avg(PnL over window) / AllocatedCapital
          drops below -X. Catches consistent small losses even if the total is modest.
        type: number
      max_consec_loss:
        description: |-
          MaxConsecLoss auto-stops the hand after N consecutive losing trades.
          Resets to 0 on any winning trade.
        type: integer
      max_single_loss_pct:
        description: |-
          MaxSingleLossPct auto-stops the hand when any single trade in the window
          lost more than X of AllocatedCapital. Guards against blow-up trades.
        type: number
      max_total_loss_pct:
        description: |-
          MaxTotalLossPct auto-stops the hand when sum(PnL over window) / AllocatedCapital
          drops below -X. e.g. 0.05 = stop when the window's cumulative loss exceeds 5%.
        type: number
      window_trades:
        description: |-
          WindowTrades is the number of most-recent closed trades to evaluate.
          0 disables all edge-degradation checks below.
        type: integer
    type: object
  mallow_helm_internal_module_hand_domain.HandHealthView:
    properties:
      last_error:
        type: string
      last_error_at:
        type: string
      last_order_at:
        type: string
      last_signal_at:
        type: string
      started_at:
        type: string
      status:
        type: string
      uptime:
        type: string
    type: object
  mallow_helm_internal_module_hand_domain.HandMetricsView:
    properties:
      latest_signal_lag_ms:
        type: integer
      loss_count:
        type: integer
      orders_failed:
        type: integer
      orders_filled:
        type: integer
      orders_placed:
        type: integer
      signal_queue_depth:
        type: integer
      signals_dropped:
        type: integer
      signals_filtered:
        type: integer
      signals_received:
        type: integer
      total_commission:
        type: number
      total_pnl:
        type: number
      trades_approved:
        type: integer
      win_count:
        type: integer
    type: object
  mallow_helm_internal_module_hand_domain.HandStatus:
    enum:
    - stopped
    - running
    - killed
    - released
    type: string
    x-enum-comments:
      HandStatusKilled: 'legacy terminal: only exists in DB from before kill API was
        removed'
      HandStatusReleased: 'terminal: positions orphaned'
    x-enum-varnames:
    - HandStatusStopped
    - HandStatusRunning
    - HandStatusKilled
    - HandStatusReleased
  mallow_helm_internal_module_hand_domain.HandSummary:
    properties:
      allocated_capital:
        type: number
      available_cash:
        description: allocated + realized_pnl - deployed
        type: number
      created_at:
        type: string
      deployed_capital:
        type: number
      futures:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.FuturesConfig'
      health:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandHealthView'
      helm_id:
        type: string
      id:
        type: string
      legs:
        description: active position legs currently held
        items:
          $ref: '#/definitions/mallow_helm_internal_module_hand_domain.LegView'
        type: array
      market:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.MarketType'
      metrics:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandMetricsView'
      name:
        type: string
      order_count:
        type: integer
      position:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.PositionConfig'
      risk:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandGuardConfig'
      running:
        type: boolean
      signal_ttl_sec:
        type: integer
      status:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandStatus'
      strategy:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.StrategySpec'
      symbols:
        items:
          type: string
        type: array
      type:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandType'
    type: object
  mallow_helm_internal_module_hand_domain.HandType:
    enum:
    - signal_follower
    - manual
    - dca
    - grid
    type: string
    x-enum-varnames:
    - HandTypeSignalFollower
    - HandTypeManual
    - HandTypeDCA
    - HandTypeGrid
  mallow_helm_internal_module_hand_domain.LegView:
    properties:
      deployed_capital:
        type: number
      entry_price:
        type: number
      opened_at:
        type: string
      phase:
        description: entering | adding | open | exiting
        type: string
      position_id:
        type: string
      qty:
        type: number
      side:
        type: string
      stop_loss:
        type: number
      symbol:
        type: string
      take_profit:
        type: number
    type: object
  mallow_helm_internal_module_hand_domain.LimitFallback:
    enum:
    - cancel
    - market
    type: string
    x-enum-comments:
      LimitFallbackCancel: cancel and do nothing
      LimitFallbackMarket: re-place as market order
    x-enum-varnames:
    - LimitFallbackCancel
    - LimitFallbackMarket
  mallow_helm_internal_module_hand_domain.MarginType:
    enum:
    - isolated
    - cross
    type: string
    x-enum-varnames:
    - MarginTypeIsolated
    - MarginTypeCross
  mallow_helm_internal_module_hand_domain.MarketType:
    enum:
    - spot
    - futures
    type: string
    x-enum-varnames:
    - MarketTypeSpot
    - MarketTypeFutures
  mallow_helm_internal_module_hand_domain.OrderType:
    enum:
    - market
    - limit
    type: string
    x-enum-varnames:
    - OrderTypeMarket
    - OrderTypeLimit
  mallow_helm_internal_module_hand_domain.PositionConfig:
    properties:
      fixed_qty:
        description: |-
          FixedQty: fixed base-asset quantity per trade.
          Used by: fixed_qty.
        type: number
      fixed_quote_qty:
        description: |-
          FixedQuoteQty: fixed quote spend per trade (e.g. 1000 USDT).
          Used by: quote_qty. Only for market-buy on spot; exchange fills max base qty.
        type: number
      max_position_pct:
        description: |-
          MaxPositionPct: hard cap on total open exposure as a fraction of equity.
          Legacy fallback — prefer AllocatedCapital for isolation.
        type: number
      max_units:
        description: |-
          MaxUnits: max concurrent entry legs. 1 = no scaling (default).
          Each signal while at max is rejected.
          Overridden downward by helm-level RiskConfig.MaxUnitsPerHand if set.
        type: integer
      pyramid:
        description: |-
          Pyramid: how additional entry signals are handled while a position is open.
          true  → merge into the existing leg (qty accumulates, avg_entry recalculated).
          false → open a new independent leg up to MaxUnits.
        type: boolean
      risk_per_trade_pct:
        description: |-
          RiskPerTradePct: the fixed fraction f of equity risked per trade (Ralph Vince).
          Used by: fixed_fractional, volatility.  e.g. 0.01 = risk 1% of equity per trade.
        type: number
      size_mode:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.SizeMode'
        description: SizeMode selects the sizing algorithm. Defaults to fixed_fractional.
      strength_sizing:
        description: |-
          StrengthSizing: when true (default), notional modes (percent_equity, fixed_qty,
          quote_qty) multiply size by signal strength [0–1]. Risk-based modes
          (fixed_fractional, volatility) always ignore this flag.
          nil → true (backward-compatible with rows written before this field existed).
        type: boolean
      unit_pct:
        description: |-
          UnitPct: fraction of allocated equity deployed per entry unit.
          Used by: percent_equity.  e.g. 0.10 = 10% of allocated equity per unit.
        type: number
    type: object
  mallow_helm_internal_module_hand_domain.SizeMode:
    enum:
    - fixed_fractional
    - fixed_qty
    - quote_qty
    - percent_equity
    - volatility
    type: string
    x-enum-comments:
      SizeModeFixedFractional: 'Ralph Vince: risk f×equity / stop (SL → ATR fallback)'
      SizeModeFixedQty: fixed base quantity (× signal strength)
      SizeModePercentEquity: 'notional: UnitPct × equity (× strength)'
      SizeModeQuoteQty: fixed quote spend per trade (× signal strength)
      SizeModeVolatility: fixed_fractional with the stop forced to ATR
    x-enum-varnames:
    - SizeModeFixedFractional
    - SizeModeFixedQty
    - SizeModeQuoteQty
    - SizeModePercentEquity
    - SizeModeVolatility
  mallow_helm_internal_module_hand_domain.StrategySpec:
    properties:
      min_strength:
        description: Signal strength filter [0–1]
        maximum: 1
        minimum: 0
        type: number
      script:
        description: Script — full source code (required)
        type: string
      timeframe:
        description: |-
          Timeframe the script operates on (e.g. "M1", "M5", "H1", "D1") — REQUIRED.
          Strategies are calibrated to a specific TF, so we never silently default;
          missing TF is a validation error. herald rejects empty TF too.
        enum:
        - M1
        - M3
        - M5
        - M15
        - M30
        - H1
        - H2
        - H4
        - H6
        - H12
        - D1
        - W1
        - MN
        type: string
    required:
    - script
    - timeframe
    type: object
  mallow_helm_internal_module_hand_dto.AllocateCapitalReq:
    properties:
      amount:
        type: number
    required:
    - amount
    type: object
  mallow_helm_internal_module_hand_dto.CapitalOverflow:
    properties:
      available:
        type: number
      error:
        type: string
      helm_equity:
        type: number
      requested:
        type: number
      suggestions:
        items:
          $ref: '#/definitions/mallow_helm_internal_module_hand_dto.CapitalSuggestion'
        type: array
      total_allocated:
        type: number
    type: object
  mallow_helm_internal_module_hand_dto.CapitalSuggestion:
    properties:
      allocated:
        type: number
      deployed:
        type: number
      hand_id:
        type: string
      name:
        type: string
      reducible_by:
        type: number
      suggested_target:
        type: number
    type: object
  mallow_helm_internal_module_hand_dto.CreateHandReq:
    properties:
      account_id:
        type: string
      allocated_capital:
        description: |-
          AllocatedCapital is the hand's fixed capital budget (quote currency, e.g. USDT).
          Must be greater than zero.
        type: number
      futures:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.FuturesDTO'
      helm_id:
        type: string
      limit_fallback:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.LimitFallback'
        enum:
        - cancel
        - market
      limit_timeout_sec:
        maximum: 3600
        minimum: 5
        type: integer
      market:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.MarketType'
        enum:
        - spot
        - futures
      name:
        maxLength: 128
        minLength: 1
        type: string
      order_type:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.OrderType'
        description: 'OrderType: default entry order type. "market" (default) or "limit".'
        enum:
        - market
        - limit
      position:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.PositionDTO'
      risk:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.HandGuardConfigDTO'
      signal_ttl_sec:
        description: 'SignalTTLSec: max age of a signal before discard. 0 = default
          (10s), -1 = disable.'
        maximum: 3600
        minimum: -1
        type: integer
      strategy:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.StrategyDTO'
      symbols:
        description: Only symbols[0] is dispatched to herald — single-symbol per hand.
          Multi-symbol deferred.
        items:
          type: string
        maxItems: 1
        minItems: 1
        type: array
      type:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandType'
        enum:
        - signal_follower
    required:
    - allocated_capital
    - name
    - strategy
    - symbols
    type: object
  mallow_helm_internal_module_hand_dto.FuturesDTO:
    properties:
      leverage:
        maximum: 125
        minimum: 1
        type: integer
      margin_type:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.MarginType'
        enum:
        - isolated
        - cross
    type: object
  mallow_helm_internal_module_hand_dto.HandActionResp:
    properties:
      id:
        type: string
      status:
        type: string
    type: object
  mallow_helm_internal_module_hand_dto.HandGuardConfigDTO:
    properties:
      max_avg_loss_pct:
        maximum: 1
        type: number
      max_consec_loss:
        maximum: 100
        minimum: 1
        type: integer
      max_single_loss_pct:
        maximum: 1
        type: number
      max_total_loss_pct:
        maximum: 1
        type: number
      window_trades:
        maximum: 1000
        minimum: 1
        type: integer
    type: object
  mallow_helm_internal_module_hand_dto.PositionDTO:
    properties:
      fixed_qty:
        type: number
      fixed_quote_qty:
        type: number
      max_position_pct:
        maximum: 1
        type: number
      max_units:
        minimum: 1
        type: integer
      pyramid:
        type: boolean
      risk_per_trade_pct:
        description: |-
          RiskPerTradePct: fraction of equity risked per trade (Ralph Vince). Capped at 0.1
          (10%) — risking more than that per trade is reckless, one stop-out near-wipes the book.
        maximum: 0.1
        type: number
      size_mode:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.SizeMode'
        enum:
        - fixed_fractional
        - fixed_qty
        - quote_qty
        - percent_equity
        - volatility
      strength_sizing:
        description: |-
          StrengthSizing scales notional modes (percent_equity, fixed_qty, quote_qty) by
          signal strength. Omit or set true to keep the default (on). Risk-based modes ignore it.
        type: boolean
      unit_pct:
        maximum: 1
        type: number
    type: object
  mallow_helm_internal_module_hand_dto.StrategyDTO:
    properties:
      min_strength:
        description: Signal strength filter [0–1]
        maximum: 1
        minimum: 0
        type: number
      script:
        description: Script — full source code (required)
        type: string
      timeframe:
        description: |-
          Timeframe the script operates on (e.g. "M1", "M5", "H1", "D1") — REQUIRED.
          Strategies are calibrated to a specific TF, so we never silently default;
          missing TF is a validation error. herald rejects empty TF too.
        enum:
        - M1
        - M3
        - M5
        - M15
        - M30
        - H1
        - H2
        - H4
        - H6
        - H12
        - D1
        - W1
        - MN
        type: string
    required:
    - script
    - timeframe
    type: object
  mallow_helm_internal_module_hand_dto.UpdateHandReq:
    properties:
      name:
        maxLength: 128
        minLength: 1
        type: string
      position:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.PositionDTO'
      risk:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.HandGuardConfigDTO'
    type: object
  mallow_helm_internal_module_helm_dto.ActionResp:
    properties:
      id:
        type: string
      status:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.AnalyticsMetaResp:
    properties:
      generated_at:
        type: string
      persister_lag_s:
        type: number
      source:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.AssetBalanceResp:
    properties:
      asset:
        type: string
      free:
        type: number
    type: object
  mallow_helm_internal_module_helm_dto.EventsPageResp:
    properties:
      events:
        items:
          $ref: '#/definitions/mallow_helm_internal_infra_journal_eventlog.EventRecord'
        type: array
      has_more:
        type: boolean
      limit:
        type: integer
      next:
        description: RFC3339 cursor; empty = no more
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.ExchangeAccountResp:
    properties:
      balances:
        items:
          $ref: '#/definitions/mallow_helm_internal_module_helm_dto.AssetBalanceResp'
        type: array
      cash:
        type: number
      equity:
        type: number
      positions:
        items:
          $ref: '#/definitions/mallow_helm_internal_module_helm_dto.ExchangePositionResp'
        type: array
    type: object
  mallow_helm_internal_module_helm_dto.ExchangeActionMetricsResp:
    properties:
      avg_ms:
        type: number
      calls:
        type: integer
      error_rate:
        type: number
      errors:
        type: integer
      max_ms:
        type: number
      min_ms:
        type: number
    type: object
  mallow_helm_internal_module_helm_dto.ExchangeMetricsResp:
    properties:
      cancel_order:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.ExchangeActionMetricsResp'
      exchange:
        type: string
      get_order:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.ExchangeActionMetricsResp'
      ping_last_ms:
        type: number
      place_order:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.ExchangeActionMetricsResp'
      sync_account:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.ExchangeActionMetricsResp'
      ws:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.ExchangeWSMetricsResp'
    type: object
  mallow_helm_internal_module_helm_dto.ExchangeOrderResp:
    properties:
      filled_avg_price:
        type: number
      filled_qty:
        type: number
      id:
        type: string
      qty:
        type: number
      side:
        type: string
      status:
        type: string
      symbol:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.ExchangePingResp:
    properties:
      exchange:
        type: string
      latency_ms:
        description: HTTP round-trip measured now
        type: number
      ws_idle_sec:
        description: seconds since last WS event
        type: number
    type: object
  mallow_helm_internal_module_helm_dto.ExchangePositionResp:
    properties:
      avg_price:
        type: number
      cur_price:
        type: number
      qty:
        type: number
      symbol:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.ExchangePriceResp:
    properties:
      price:
        type: number
      symbol:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.ExchangeWSMetricsResp:
    properties:
      balance_events:
        type: integer
      fill_events:
        type: integer
      idle_sec:
        description: seconds since last WS event; 0 = never received
        type: number
      lifecycle_events:
        type: integer
      stream_errors:
        type: integer
      stream_starts:
        type: integer
    type: object
  mallow_helm_internal_module_helm_dto.FillPageResp:
    properties:
      fills:
        items:
          $ref: '#/definitions/mallow_helm_internal_module_helm_dto.FillResp'
        type: array
      has_more:
        type: boolean
      limit:
        type: integer
      next:
        description: RFC3339 cursor; empty = end
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.FillResp:
    properties:
      avg_price:
        type: number
      fee:
        type: number
      filled_at:
        type: string
      hand_id:
        type: string
      kind:
        type: string
      order_id:
        type: string
      qty:
        type: number
      side:
        type: string
      symbol:
        type: string
      trade_id:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.GroupedKPIResp:
    properties:
      avg_r:
        type: number
      key:
        type: string
      n_trades:
        type: integer
      net_pnl:
        type: number
      win_rate:
        type: number
    type: object
  mallow_helm_internal_module_helm_dto.HelmDetailResp:
    properties:
      account_id:
        type: string
      account_type:
        type: string
      broker_type:
        type: string
      created_at:
        type: string
      halted:
        description: |-
          Halted is true when the runtime risk manager has tripped a circuit-breaker
          (max drawdown or daily loss limit). New entries are blocked; exits still pass.
          Authoritative from the runtime; also reflected in Status="halted" after DB persist.
        type: boolean
      hands:
        items:
          $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandSummary'
        type: array
      id:
        type: string
      last_sync_at:
        type: string
      name:
        type: string
      paused:
        type: boolean
      risk:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.RiskConfigDTO'
      running:
        type: boolean
      status:
        type: string
      updated_at:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.HelmResp:
    properties:
      account_id:
        type: string
      account_type:
        type: string
      broker_type:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      risk:
        $ref: '#/definitions/mallow_helm_internal_module_helm_dto.RiskConfigDTO'
      status:
        type: string
      updated_at:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.OrderHistoryResp:
    properties:
      client_order_id:
        type: string
      exchange_order_id:
        type: string
      filled_price:
        type: string
      filled_qty:
        type: string
      hand_id:
        type: string
