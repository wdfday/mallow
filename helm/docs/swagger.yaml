info:
  contact: {}
  description: Helm service APIs for helms, hands, and signal engine control.
  title: Helm Service API
  version: "1.0"
paths:
  /api/v1/accounts:
    get:
      parameters:
      - description: Filter by account type
        in: query
        name: account_type
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.SuccessResponse-mallow_helm_internal_module_account_dto_AccountsListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my accounts
      tags:
      - accounts
  /api/v1/accounts/{id}:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.SuccessResponse-mallow_helm_internal_module_account_dto_AccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account by ID
      tags:
      - accounts
  /api/v1/hands:
    get:
      description: |-
        Returns hands for every helm id in ?helm_ids (CSV) the caller owns,
        merged into one list. Pass ?live=true for runtime-only hands.
        Unowned/invalid helm ids are skipped. Avoids client-side N+1.
      parameters:
      - description: Comma-separated helm IDs
        in: query
        name: helm_ids
        required: true
        type: string
      - description: Only hands live in the runtime (excludes terminal)
        in: query
        name: live
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.SuccessResponse-array_mallow_helm_internal_module_hand_domain_HandSummary'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List hands across several helms in one request
      tags:
      - hands
    post:
      consumes:
      - application/json
      parameters:
      - description: Hand create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/mallow_helm_internal_module_hand_dto.CreateHandReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.SuccessResponse-mallow_helm_internal_module_hand_domain_HandSummary'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create hand
      tags:
      - hands
  /api/v1/hands/{helmId}:
    get:
      description: |-
        Returns every hand of the helm, including terminal (killed/released)
        hands restored from the DB. Pass ?live=true to return only hands
        currently wired into the runtime (terminal hands excluded).
      parameters:
      - description: Helm ID
        in: path
        name: helmId
        required: true
        type: string
      - description: Only return hands live in the runtime (excludes terminal)
        in: query
        name: live
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.SuccessResponse-array_mallow_helm_internal_module_hand_domain_HandSummary'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List hands for a helm
      tags:
      - hands
  /api/v1/hands/{helmId}/{id}:
    get:
      parameters:
      - description: Helm ID
        in: path
        name: helmId
        required: true
        type: string
      - description: Hand ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.SuccessResponse-mallow_helm_internal_module_hand_domain_HandSummary'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get hand
      tags:
      - hands
    put:
      consumes:
      - application/json
      parameters:
      - description: Helm ID
        in: path
        name: helmId
        required: true
        type: string
      - description: Hand ID
        in: path
        name: id
        required: true
        type: string
      - description: Hand update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/mallow_helm_internal_module_hand_dto.UpdateHandReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.SuccessResponse-mallow_helm_internal_module_hand_domain_HandSummary'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update hand
      tags:
      - hands
  /api/v1/hands/{helmId}/{id}/activity:
    get:
      description: Persistent events for this hand from PostgreSQL, newest first.
        Supports ?limit= (default 100) and ?before= (RFC3339 cursor for pagination).
      parameters:
      - description: Helm ID
        in: path
        name: helmId
        required: true
        type: string
      - description: Hand ID
        in: path
        name: id
        required: true
        type: string
      - default: 100
        description: Max events to return
        in: query
        name: limit
        type: integer
      - description: Return events before this RFC3339 timestamp (pagination cursor)
        in: query
        name: before
        type: string
      produces:
      - text/plain
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.SuccessResponse-array_mallow_helm_internal_infra_journal_eventlog_EventRecord'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get hand activity log
      tags:
      - system
      - hands
  /api/v1/hands/{helmId}/{id}/allocate-capital:
    post:
      consumes:
      - application/json
      parameters:
      - description: Helm ID
        in: path
        name: helmId
        required: true
        type: string
      - description: Hand ID
        in: path
        name: id
        required: true
        type: string
      - description: Capital allocation request
        in: body
        name: request
