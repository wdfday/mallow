// Mallow Trading System — Protobuf message protocol index.
//
// This file imports all sub-schemas. Compile this file to get the full set.
//
// ── NATS Subject Map ─────────────────────────────────────────────────────────
//
//   bars.{symbol}       ← herald → helm  (BarMsg)
//   signals             ← herald → helm  (SignalResponse; JetStream durable)
//
//   engine.reset        ← helm   → herald (ResetMsg, no reply)
//   engine.register     ← helm   → herald (RegisterMsg → JSON ack)
//   engine.deregister   ← helm   → herald (DeregisterMsg → JSON ack)
//   engine.list         ← helm   → herald (→ HandListResponse)
//   engine.ping         ← helm   → herald (→ PingResponse)
//   engine.heartbeat    ← helm   → herald (HeartbeatRequest → HeartbeatResponse)
//   engine.ready        ← herald → helm  (ReadyEvent; JetStream publish)
//
// ── Files ────────────────────────────────────────────────────────────────────
//
//   market_data.proto  — TickMsg, BarMsg
//   signal.proto       — SignalMsg, SignalResponse
//   registry.proto     — ResetMsg, RegisterMsg, DeregisterMsg, HandInfo, HandListResponse
//   engine.proto       — PingResponse, HeartbeatRequest, HeartbeatResponse, ReadyEvent

syntax = "proto3";
package market;

option go_package = "mallow/helm/internal/proto";

import "market_data.proto";
import "signal.proto";
import "registry.proto";
import "engine.proto";
