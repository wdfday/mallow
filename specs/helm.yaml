basePath: /
definitions:
  mallow_helm_internal_module_account_dto.AccountResponse:
    properties:
      account_name:
        type: string
      account_type:
        type: string
      broker_connection_id:
        type: string
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      include_in_net_worth:
        type: boolean
      institution_name:
        type: string
      is_active:
        type: boolean
      is_auto_sync:
        type: boolean
      last_synced_at:
        type: string
      sync_error_message:
        type: string
      sync_status:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  mallow_helm_internal_module_account_dto.AccountsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/mallow_helm_internal_module_account_dto.AccountResponse'
        type: array
      total:
        type: integer
    type: object
  mallow_helm_internal_module_hand_domain.FuturesConfig:
    properties:
      leverage:
        description: e.g. 10 for 10x; 1 = no leverage
        type: integer
      margin_type:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.MarginType'
        description: '"isolated" | "cross"'
    type: object
  mallow_helm_internal_module_hand_domain.HandHealthView:
    properties:
      last_error:
        type: string
      last_error_at:
        type: string
      last_order_at:
        type: string
      last_signal_at:
        type: string
      started_at:
        type: string
      status:
        type: string
      uptime:
        type: string
    type: object
  mallow_helm_internal_module_hand_domain.HandMetricsView:
    properties:
      loss_count:
        type: integer
      orders_failed:
        type: integer
      orders_filled:
        type: integer
      orders_placed:
        type: integer
      signals_filtered:
        type: integer
      signals_received:
        type: integer
      total_pnl:
        type: number
      trades_approved:
        type: integer
      win_count:
        type: integer
    type: object
  mallow_helm_internal_module_hand_domain.HandRiskConfig:
    properties:
      max_avg_loss_pct:
        description: |-
          MaxAvgLossPct pauses the hand when avg(PnL over window) / AllocatedCapital
          drops below -X. Catches consistent small losses even if the total is modest.
        type: number
      max_consec_loss:
        description: |-
          MaxConsecLoss pauses the hand after N consecutive losing trades.
          Resets to 0 on any winning trade.
        type: integer
      max_single_loss_pct:
        description: |-
          MaxSingleLossPct pauses the hand when any single trade in the window
          lost more than X of AllocatedCapital. Guards against blow-up trades.
        type: number
      max_total_loss_pct:
        description: |-
          MaxTotalLossPct pauses the hand when sum(PnL over window) / AllocatedCapital
          drops below -X. e.g. 0.05 = pause when the window's cumulative loss exceeds 5%.
        type: number
      window_trades:
        description: |-
          WindowTrades is the number of most-recent closed trades to evaluate.
          0 disables all edge-degradation checks below.
        type: integer
    type: object
  mallow_helm_internal_module_hand_domain.HandStatus:
    enum:
    - stopped
    - running
    - paused
    type: string
    x-enum-varnames:
    - HandStatusStopped
    - HandStatusRunning
    - HandStatusPaused
  mallow_helm_internal_module_hand_domain.HandSummary:
    properties:
      allocated_capital:
        type: number
      created_at:
        type: string
      deployed_capital:
        type: number
      futures:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.FuturesConfig'
      health:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandHealthView'
      helm_id:
        type: string
      id:
        type: string
      market:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.MarketType'
      metrics:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandMetricsView'
      name:
        type: string
      order_count:
        type: integer
      position:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.PositionConfig'
      risk:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandRiskConfig'
      running:
        type: boolean
      signal_ttl_sec:
        type: integer
      status:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandStatus'
      strategy:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.StrategySpec'
      symbols:
        items:
          type: string
        type: array
      type:
        $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandType'
    type: object
  mallow_helm_internal_module_hand_domain.HandType:
    enum:
    - signal_follower
    - manual
    - dca
    - grid
    type: string
    x-enum-varnames:
    - HandTypeSignalFollower
    - HandTypeManual
    - HandTypeDCA
    - HandTypeGrid
  mallow_helm_internal_module_hand_domain.LimitFallback:
    enum:
    - cancel
    - market
    type: string
    x-enum-comments:
      LimitFallbackCancel: cancel and do nothing
      LimitFallbackMarket: re-place as market order
    x-enum-varnames:
    - LimitFallbackCancel
    - LimitFallbackMarket
  mallow_helm_internal_module_hand_domain.MarginType:
    enum:
    - isolated
    - cross
    type: string
    x-enum-varnames:
    - MarginTypeIsolated
    - MarginTypeCross
  mallow_helm_internal_module_hand_domain.MarketType:
    enum:
    - spot
    - futures
    type: string
    x-enum-varnames:
    - MarketTypeSpot
    - MarketTypeFutures
  mallow_helm_internal_module_hand_domain.OrderType:
    enum:
    - market
    - limit
    type: string
    x-enum-varnames:
    - OrderTypeMarket
    - OrderTypeLimit
  mallow_helm_internal_module_hand_domain.PositionConfig:
    properties:
      fixed_qty:
        description: |-
          FixedQty: fixed base-asset quantity per trade.
          Used by: fixed_qty.
        type: number
      fixed_quote_qty:
        description: |-
          FixedQuoteQty: fixed quote spend per trade (e.g. 1000 USDT).
          Used by: quote_qty. Only for market-buy on spot; exchange fills max base qty.
        type: number
      max_position_pct:
        description: |-
          MaxPositionPct: hard cap on total open exposure as a fraction of equity.
          Legacy fallback — prefer AllocatedCapital for isolation.
        type: number
      max_units:
        description: |-
          MaxUnits: max concurrent entry legs. 1 = no scaling (default).
          Each signal while at max is rejected.
          Overridden downward by helm-level RiskConfig.MaxUnitsPerHand if set.
        type: integer
      pyramid:
        description: |-
          Pyramid: how additional entry signals are handled while a position is open.
          true  → merge into the existing leg (qty accumulates, avg_entry recalculated).
          false → open a new independent leg up to MaxUnits.
        type: boolean
      risk_per_trade_pct:
        description: |-
          RiskPerTradePct: fraction of allocated capital risked per trade.
          Used by: fixed_fractional, volatility.  e.g. 0.01 = 1%.
        type: number
      size_mode:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.SizeMode'
        description: SizeMode selects the sizing algorithm. Defaults to fixed_fractional.
      unit_capital:
        description: |-
          UnitCapital: fixed USDT amount per entry unit.
          Used by: percent_equity (takes priority over UnitPct when non-zero).
        type: number
      unit_pct:
        description: |-
          UnitPct: fraction of allocated capital per entry unit.
          Used by: percent_equity (fallback when UnitCapital is zero).  e.g. 0.10 = 10%.
        type: number
    type: object
  mallow_helm_internal_module_hand_domain.SizeMode:
    enum:
    - fixed_fractional
    - fixed_qty
    - quote_qty
    - percent_equity
    - volatility
    type: string
    x-enum-comments:
      SizeModeFixedFractional: scale unit by signal confidence
      SizeModeFixedQty: fixed base quantity
      SizeModePercentEquity: fixed % of equity
      SizeModeQuoteQty: fixed quote spend per trade
      SizeModeVolatility: ATR-based risk parity
    x-enum-varnames:
    - SizeModeFixedFractional
    - SizeModeFixedQty
    - SizeModeQuoteQty
    - SizeModePercentEquity
    - SizeModeVolatility
  mallow_helm_internal_module_hand_domain.StrategySpec:
    properties:
      min_strength:
        description: Signal strength filter [0–1]
        maximum: 1
        minimum: 0
        type: number
      script:
        description: Script — full source code (required)
        type: string
      timeframe:
        description: |-
          Timeframe the script operates on (e.g. "M1", "M5", "H1", "D1") — REQUIRED.
          Strategies are calibrated to a specific TF, so we never silently default;
          missing TF is a validation error. herald rejects empty TF too.
        enum:
        - M1
        - M5
        - M15
        - M30
        - H1
        - H4
        - D1
        - W1
        type: string
    required:
    - script
    - timeframe
    type: object
  mallow_helm_internal_module_hand_dto.CreateHandReq:
    properties:
      account_id:
        type: string
      allocated_capital:
        description: |-
          AllocatedCapital is the hand's fixed capital budget (quote currency, e.g. USDT).
          Zero means the hand draws from full helm equity without isolation.
        minimum: 0
        type: number
      futures:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.FuturesDTO'
      helm_id:
        type: string
      limit_fallback:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.LimitFallback'
        enum:
        - cancel
        - market
      limit_timeout_sec:
        maximum: 3600
        minimum: 5
        type: integer
      market:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.MarketType'
        enum:
        - spot
        - futures
      name:
        maxLength: 128
        minLength: 1
        type: string
      order_type:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.OrderType'
        description: 'OrderType: default entry order type. "market" (default) or "limit".'
        enum:
        - market
        - limit
      position:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.PositionDTO'
      risk:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.HandRiskConfigDTO'
      signal_ttl_sec:
        description: 'SignalTTLSec: max age of a signal before discard. 0 = default
          (10s), -1 = disable.'
        maximum: 3600
        minimum: -1
        type: integer
      strategy:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.StrategyDTO'
      symbols:
        items:
          type: string
        minItems: 1
        type: array
      type:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.HandType'
        enum:
        - signal_follower
    required:
    - name
    - strategy
    - symbols
    type: object
  mallow_helm_internal_module_hand_dto.FuturesDTO:
    properties:
      leverage:
        maximum: 125
        minimum: 1
        type: integer
      margin_type:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.MarginType'
        enum:
        - isolated
        - cross
    type: object
  mallow_helm_internal_module_hand_dto.HandActionResp:
    properties:
      id:
        type: string
      status:
        type: string
    type: object
  mallow_helm_internal_module_hand_dto.HandRiskConfigDTO:
    properties:
      max_avg_loss_pct:
        maximum: 1
        type: number
      max_consec_loss:
        maximum: 100
        minimum: 1
        type: integer
      max_single_loss_pct:
        maximum: 1
        type: number
      max_total_loss_pct:
        maximum: 1
        type: number
      window_trades:
        maximum: 1000
        minimum: 1
        type: integer
    type: object
  mallow_helm_internal_module_hand_dto.PositionDTO:
    properties:
      fixed_qty:
        type: number
      fixed_quote_qty:
        type: number
      max_position_pct:
        maximum: 1
        type: number
      max_units:
        minimum: 1
        type: integer
      pyramid:
        type: boolean
      risk_per_trade_pct:
        maximum: 1
        type: number
      size_mode:
        allOf:
        - $ref: '#/definitions/mallow_helm_internal_module_hand_domain.SizeMode'
        enum:
        - fixed_fractional
        - fixed_qty
        - quote_qty
        - percent_equity
        - volatility
      unit_capital:
        minimum: 0
        type: number
      unit_pct:
        maximum: 1
        type: number
    type: object
  mallow_helm_internal_module_hand_dto.StrategyDTO:
    properties:
      min_strength:
        description: Signal strength filter [0–1]
        maximum: 1
        minimum: 0
        type: number
      script:
        description: Script — full source code (required)
        type: string
      timeframe:
        description: |-
          Timeframe the script operates on (e.g. "M1", "M5", "H1", "D1") — REQUIRED.
          Strategies are calibrated to a specific TF, so we never silently default;
          missing TF is a validation error. herald rejects empty TF too.
        enum:
        - M1
        - M5
        - M15
        - M30
        - H1
        - H4
        - D1
        - W1
        type: string
    required:
    - script
    - timeframe
    type: object
  mallow_helm_internal_module_hand_dto.UpdateHandReq:
    properties:
      allocated_capital:
        minimum: 0
        type: number
      name:
        maxLength: 128
        minLength: 1
        type: string
      position:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.PositionDTO'
      risk:
        $ref: '#/definitions/mallow_helm_internal_module_hand_dto.HandRiskConfigDTO'
      signal_ttl_sec:
        maximum: 3600
        minimum: -1
        type: integer
    type: object
  mallow_helm_internal_module_helm_dto.ActionResp:
    properties:
      id:
        type: string
      status:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.EquityPageResp:
    properties:
      has_more:
        type: boolean
      limit:
        type: integer
      next:
        type: string
      points:
