    type: object
  mallow_helm_internal_module_helm_dto.EquityPointResp:
    properties:
      equity:
        type: number
      hand_id:
        type: string
      ts:
        type: string
    type: object
  mallow_helm_internal_module_helm_dto.ExchangeAccountResp:
    properties:
      cash:
        type: number
      equity:
        type: number
      positions:
        items:
