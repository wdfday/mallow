info:
  contact: {}
  description: Helm service APIs for helms, hands, and signal engine control.
  title: Helm Service API
  version: "1.0"
paths:
  /api/v1/accounts:
    get:
      parameters:
      - description: Filter by account type
        in: query
        name: account_type
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.SuccessResponse-mallow_helm_internal_module_account_dto_AccountsListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my accounts
      tags:
      - accounts
  /api/v1/accounts/{id}:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.SuccessResponse-mallow_helm_internal_module_account_dto_AccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account by ID
      tags:
      - accounts
  /api/v1/accounts/{id}/equity:
    get:
      description: Time-cursor pagination over HELM_EQUITY JetStream stream, fan-out
        across all hands under the account's helm.
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: RFC3339 cursor (exclusive); omit for all
        in: query
        name: after
        type: string
      - default: 200
        description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.SuccessResponse-mallow_helm_internal_module_helm_dto_EquityPageResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Equity curve for an account
      tags:
      - accounts
  /api/v1/accounts/{id}/events:
    get:
      description: Subscribes to helm.events.{helmID} and streams behavioral events
        (signals, orders, fills, lifecycle).
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/mallow_helm_internal_shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stream real-time helm events for an account via SSE
      tags:
      - accounts
  /api/v1/accounts/{id}/fills:
    get:
      description: Time-cursor pagination over TRADE_FILLS JetStream stream. Pass
        `after` (RFC3339) from previous response to page forward.
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: RFC3339 cursor (exclusive); omit for all
        in: query
        name: after
        type: string
      - default: 200
        description: Page size
        in: query
        name: limit
        type: integer
      produces:
