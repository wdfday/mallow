openapi: 3.0.3
info:
  title: Herald API
  description: Signal engine HTTP API
  license:
    name: ''
  version: 0.1.0
paths:
  /api/v1/backtest:
    post:
      tags:
      - backtest
      operationId: run_backtest
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
        required: true
      responses:
        '200':
          description: Backtest report
        '400':
          description: Bad request
        '429':
          description: Too many concurrent backtests
  /api/v1/backtest/script:
    post:
      tags:
      - backtest
      operationId: run_backtest_script
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptBacktestRequest'
        required: true
      responses:
        '200':
          description: Script backtest report
        '400':
          description: Bad request
        '429':
          description: Too many concurrent backtests
  /api/v1/data/{source}/{symbol}:
    post:
      tags:
      - live
      operationId: unified_data
      parameters:
      - name: source
        in: path
        description: 'Exchange source: binance | okx | bybit'
        required: true
        schema:
          type: string
      - name: symbol
        in: path
        description: Symbol ticker e.g. BTCUSDT, BTC-USDT
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnifiedDataRequest'
        required: true
      responses:
        '200':
          description: OHLCV bars
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedDataResponse'
        '400':
          description: Unknown source
        '404':
          description: Symbol not found in ledger
  /api/v1/indicators:
    get:
      tags:
      - live
      operationId: list_indicators_catalog
      responses:
        '200':
          description: Indicator catalogue (static)
  /api/v1/script/validate:
    post:
      tags:
      - backtest
      operationId: validate_script
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptValidateReq'
        required: true
      responses:
        '200':
          description: Lint result — empty errors means clean script
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptValidateResp'
        '400':
          description: Request body malformed
  /api/v1/strategies:
    get:
      tags:
      - backtest
      operationId: list_strategies
      responses:
        '200':
          description: Named and MTF strategy keys
  /api/v1/strategy/my:
    get:
      tags:
      - strategy
      operationId: list_my_strategies
      responses:
        '200':
          description: All versions of each strategy owned by the caller, grouped by name (newest first per group)
        '401':
          description: Missing X-User-ID header
  /api/v1/strategy/strategies:
    get:
      tags:
      - strategy
      operationId: list_strategies
      responses:
        '200':
          description: List of saved strategies
    post:
      tags:
      - strategy
      operationId: create_strategy
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrategyReq'
        required: true
      responses:
        '201':
          description: Strategy created
        '409':
          description: Conflict — version already exists
  /api/v1/strategy/strategies/{id}:
    get:
      tags:
      - strategy
      operationId: get_strategy
      parameters:
      - name: id
        in: path
        description: Strategy UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Strategy record
        '404':
          description: Not found
    put:
      tags:
      - strategy
      operationId: update_strategy
      parameters:
      - name: id
        in: path
        description: Strategy UUID
        required: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStrategyReq'
        required: true
      responses:
        '200':
          description: Updated strategy record
        '404':
          description: Not found
    delete:
      tags:
      - strategy
      operationId: delete_strategy
      parameters:
      - name: id
        in: path
        description: Strategy UUID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
  /api/v1/symbols:
    get:
      tags:
      - live
      operationId: list_symbols
      responses:
        '200':
          description: List of tracked symbols grouped by exchange
components:
  schemas:
    BacktestRequest:
      type: object
      required:
      - strategy
      - symbol
      properties:
        asset_type:
          type: string
          description: |-
            Asset class — controls lot sizing.
            `"crypto"` → fractional qty; `"stock"` → whole shares; `"vn_stock"` → lots of 100.
          nullable: true
        atr_multiplier:
          type: number
          format: double
          description: |-
            ATR stop-distance multiplier for volatility sizing (default: 2.0).
            Only read when `risk_per_trade_pct` is set.
          nullable: true
        commission_pct:
          type: number
          format: double
          description: 'Commission per trade as a fraction of trade value (default: 0.001).'
          nullable: true
        data_source:
          type: string
          description: |-
            Data source — selects which provider subdirectory to load bars from.
            Values: `"polygon"` (US stocks), `"bnb"` (Binance crypto),
            `"vci"` (VN stocks), `"okx"` (OKX crypto).
            Derives market region automatically: polygon→us, vci→vn, bnb/okx→crypto (no filter).
          nullable: true
        from:
          type: string
          description: 'Date range start, inclusive. Format: `"YYYY-MM-DD"`.'
          nullable: true
        initial_capital:
          type: number
          format: double
          description: 'Starting capital in USD (default: 10 000).'
          nullable: true
        intra_bar_mode:
          type: string
          description: |-
            Intra-bar stop detection mode.
            `"close_only"` (default) | `"pessimistic"` | `"ohlc_heuristic"`.
          nullable: true
        max_position_pct:
          type: number
          format: double
          description: |-
            Pyramiding: hard cap on total open exposure as a fraction of equity
            (default: 0 = no cap). Mirrors helm `MaxPositionPct`.
          nullable: true
        max_positions:
          type: integer
          description: 'Maximum simultaneous open positions (default: 1).'
          nullable: true
          minimum: 0
        max_units:
          type: integer
          description: |-
            Pyramiding: max accumulated entry legs per symbol (default: 1 = off).
            When >1, a same-direction signal while in-position adds a leg if price
            advanced past the last leg; TP/SL re-base to the new leg. Mirrors helm `MaxUnits`.
          nullable: true
          minimum: 0
        monte_carlo:
          allOf:
          - $ref: '#/components/schemas/MonteCarloConfig'
          nullable: true
        params:
          description: |-
            Strategy-specific parameters as a JSON object.

            All values are scalars (`f64` or `u64`), except for array params such as
            GMMA period lists. Unknown keys are silently ignored; missing keys use
            per-strategy defaults.
          nullable: true
        position_size_pct:
          type: number
          format: double
          description: 'Fraction of equity to allocate per trade (default: 0.95).'
          nullable: true
        position_size_quantity:
          type: number
          format: double
          description: Fixed quantity per trade. Overrides both USD and pct sizing.
          nullable: true
        position_size_usd:
          type: number
          format: double
          description: Fixed dollar amount per trade. Overrides `position_size_pct`.
          nullable: true
        pyramid:
          type: boolean
          description: |-
            Pyramiding mode (only meaningful when `max_units > 1`). `true`/None (default)
            = MERGE: legs collapse into one averaged position, TP/SL re-based to the last
            leg. `false` = INDEPENDENT: each leg is its own position (`SYM#n`) with its own
            entry / TP / SL / trade. Mirrors helm `Pyramid`.
          nullable: true
        risk_free_annual:
          type: number
          format: double
          description: 'Risk-free annual rate used for Sharpe/Sortino (default: 0.04).'
          nullable: true
        risk_per_trade_pct:
          type: number
          format: double
          description: |-
            Volatility (ATR risk-parity) sizing — the backtest counterpart of helm's
            `volatility` SizeMode. When set (and no fixed-qty / fixed-USD override is
            present) the sizer becomes ATR-based: `qty = equity × risk_per_trade_pct /
            (atr_multiplier × ATR)`. e.g. `0.01` = risk 1% of equity per trade.
          nullable: true
        size_mode:
          type: string
          description: |-
            Explicit sizing mode, synced with helm `SizeMode` (canonical path; when unset,
            the sizer is inferred from which `position_size_*` / `risk_per_trade_pct` field is set):
            `fixed_fractional` (Ralph Vince — risk f% to the signal's stop) · `volatility` (risk f%
            to an ATR stop) · `percent_equity` (% of equity) · `quote_qty` (USD) · `fixed_qty` (qty).
          nullable: true
        slippage_pct:
          type: number
          format: double
          description: 'Slippage per trade as a fraction of trade value (default: 0.0005).'
          nullable: true
        strategy:
          type: string
          description: Strategy key, e.g. `"rsi_mean_rev"`. See `alm-strategy::catalog::STRATEGY_KEYS`.
        strength_sizing:
          type: boolean
          description: |-
            Whether `signal.strength` scales the position size (default: `true`).
            Set `false` to compute strength in the script/strategy for display/logging
            while every entry is sized at full allocation (strength treated as 1.0).
            Only affects the `percent_equity` mode. Risk-based modes (`fixed_fractional`,
            `volatility`) pin a fixed risk to the stop, so strength is ignored there to
            preserve that invariant; fixed-USD / fixed-quantity are absolute.
          nullable: true
        symbol:
          type: string
          description: Asset symbol, e.g. `"BTCUSDT"`.
        timeframe:
          type: string
          description: Timeframe subdirectory, e.g. `"H1"`, `"M1"`, `"D1"`.
          nullable: true
        to:
          type: string
          description: 'Date range end, inclusive. Format: `"YYYY-MM-DD"`.'
          nullable: true
        walk_forward:
          allOf:
          - $ref: '#/components/schemas/WalkForwardConfig'
          nullable: true
    BarRecord:
      type: object
      description: Single OHLCV bar on the wire. Short field names to cut payload size.
      required:
      - t
      - o
      - h
      - l
      - c
      - v
      properties:
        c:
          type: number
          format: double
        h:
          type: number
          format: double
        l:
          type: number
          format: double
        n:
          type: integer
          format: int64
          nullable: true
        o:
          type: number
          format: double
        t:
          type: integer
          format: int64
          description: Unix milliseconds (UTC).
        v:
          type: number
          format: double
        vwap:
          type: number
          format: double
          nullable: true
    CandlesQuery:
      type: object
      description: Candle section controls of a unified request.
      properties:
        after:
          type: integer
          format: int64
          description: Bars with `t > after`, oldest-first. Unix milliseconds.
          nullable: true
        before:
          type: integer
          format: int64
          description: Bars with `t < before`, newest-first. Unix milliseconds.
          nullable: true
        limit:
          type: integer
          description: Max bars to return. Default 500, max 5000.
          nullable: true
          minimum: 0
    CandlesResult:
      type: object
      required:
      - count
      - bars
      properties:
        bars:
          type: array
          items:
            $ref: '#/components/schemas/BarRecord'
        count:
          type: integer
          minimum: 0
        next_after:
          type: integer
          format: int64
          nullable: true
        next_before:
          type: integer
          format: int64
          nullable: true
        truncated_below:
          type: boolean
    CreateStrategyReq:
      type: object
      required:
      - name
      - label
      - strategy_spec
      properties:
        label:
          type: string
        name:
          type: string
        notes:
          type: string
          nullable: true
        previous_id:
          type: string
          description: UUID of the strategy version this is branched/updated from.
          nullable: true
        strategy_spec:
          $ref: '#/components/schemas/StrategySpec'
        user_id:
          type: string
          description: Override owner user ID. If absent, extracted from X-User-ID header.
          nullable: true
        version:
          type: integer
          format: int32
          description: If omitted, auto-incremented from the highest existing version for `name`.
          nullable: true
    DeclaredIndicator:
      type: object
      description: Per-line declared indicator summary returned in the lint scope.
      required:
      - name
      - ind_type
      - period
      properties:
        ind_type:
          type: string
        live:
          type: boolean
        multi:
          type: boolean
          description: '`true` → this indicator returns `Array<Map>` (multi-field access).'
        name:
          type: string
        period:
          type: integer
          minimum: 0
        timeframe:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      description: |-
        Error envelope matching the Go `shared.ErrorResponse` shape:
        `{ "status": 400, "code": "BAD_REQUEST", "message": "..." }`.
      required:
      - status
      - message
      properties:
        code:
          type: string
          nullable: true
        message:
          type: string
        status:
          type: integer
          format: int32
          minimum: 0
    LintDiagnostic:
      type: object
      description: A lint diagnostic with Monaco-compatible line/col coordinates (1-based).
      required:
      - line
      - col
      - message
      - severity
      properties:
        col:
          type: integer
          description: 1-based column number (0 = unknown).
          minimum: 0
        line:
          type: integer
          description: 1-based line number (0 = unknown / whole-script).
          minimum: 0
        message:
          type: string
        severity:
          type: string
          description: '`"error"` or `"warning"`.'
    MonteCarloConfig:
      type: object
      description: Monte Carlo bootstrap config.
      properties:
        n_iter:
          type: integer
          description: 'Bootstrap iterations (default: 1 000).'
          nullable: true
          minimum: 0
        ruin_threshold:
          type: number
          format: double
          description: 'Ruin floor as fraction of initial capital (default: 0.50).'
          nullable: true
        seed:
          type: integer
          format: int64
          description: RNG seed for reproducibility (`null` = time-based).
          nullable: true
          minimum: 0
    ScriptBacktestRequest:
      type: object
      description: |-
        Dedicated request for script backtests — pure engine run, no persistence.

        Any `plot("name", value)` calls inside the script populate
        `indicator_series` in the response.

        To save a strategy, use `POST /api/v1/strategy/strategies` separately.
      required:
      - symbol
      - script
      properties:
        asset_type:
          type: string
          nullable: true
        atr_multiplier:
          type: number
          format: double
          description: 'ATR stop-distance multiplier for volatility sizing (default: 2.0).'
          nullable: true
        commission_pct:
          type: number
          format: double
          nullable: true
        data_source:
          type: string
          nullable: true
        from:
          type: string
          nullable: true
        initial_capital:
          type: number
          format: double
          nullable: true
        intra_bar_mode:
          type: string
          nullable: true
        max_position_pct:
          type: number
          format: double
          description: 'Pyramiding: exposure cap as fraction of equity (0 = none). Mirrors helm `MaxPositionPct`.'
          nullable: true
        max_positions:
          type: integer
          nullable: true
          minimum: 0
        max_units:
          type: integer
          description: 'Pyramiding: max accumulated legs (default 1 = off). Mirrors helm `MaxUnits`.'
          nullable: true
          minimum: 0
        monte_carlo:
          allOf:
          - $ref: '#/components/schemas/MonteCarloConfig'
          nullable: true
        position_size_pct:
          type: number
          format: double
          nullable: true
        position_size_quantity:
          type: number
          format: double
          nullable: true
        position_size_usd:
          type: number
          format: double
          nullable: true
        pyramid:
          type: boolean
          description: 'Pyramiding mode: true/None = MERGE (averaged), false = INDEPENDENT legs. Mirrors helm `Pyramid`.'
          nullable: true
        risk_free_annual:
          type: number
          format: double
          nullable: true
        risk_per_trade_pct:
          type: number
          format: double
          description: Volatility (ATR risk-parity) sizing. See [`BacktestRequest::risk_per_trade_pct`].
          nullable: true
        script:
          type: string
          description: Full strategy script.
        size_mode:
          type: string
          description: Explicit sizing mode synced with helm `SizeMode`. See [`BacktestRequest::size_mode`].
          nullable: true
        slippage_pct:
          type: number
          format: double
          nullable: true
        strength_sizing:
          type: boolean
          description: |-
            Whether `signal.strength` scales the position size (default: `true`).
            See [`BacktestRequest::strength_sizing`].
          nullable: true
        symbol:
          type: string
          description: Symbol to backtest, e.g. `"BTCUSDT"`.
        timeframe:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
        walk_forward:
          allOf:
          - $ref: '#/components/schemas/WalkForwardConfig'
          nullable: true
    ScriptLintScope:
      type: object
      description: Scope information for Monaco autocomplete / hover.
      required:
      - indicators
      - bar_fields
      - output_vars
      - functions
      properties:
        bar_fields:
          type: array
          items:
            type: string
        functions:
          type: array
          items:
            type: string
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/DeclaredIndicator'
        output_vars:
          type: array
          items:
            type: string
    ScriptValidateReq:
      type: object
      required:
      - script
      properties:
        base_tf:
          type: string
          description: |-
            Optional base timeframe (e.g. `"M1"`, `"H1"`). When provided, the linter
            will flag any HTF indicator declared on a TF smaller than the base TF.
          nullable: true
        script:
          type: string
          description: Full strategy script to lint.
    ScriptValidateResp:
      type: object
      required:
      - errors
      - scope
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/LintDiagnostic'
          description: List of diagnostics. Empty → script is clean.
        scope:
          $ref: '#/components/schemas/ScriptLintScope'
    Strategy:
      type: object
      description: |-
        A versioned strategy definition. Each (name, version) pair is immutable
        once created — create a new version to iterate on a spec.
      required:
      - id
      - name
      - version
      - label
      - strategy_spec
      - created_at
      properties:
        created_at:
          type: integer
          format: int64
        id:
          type: string
          description: UUID v7 — identifies this exact version.
        label:
          type: string
          description: Human-readable display label.
        name:
          type: string
          description: Stable slug that groups all versions of the same strategy.
        notes:
          type: string
          description: Optional change notes for this version.
          nullable: true
        previous_id:
          type: string
          description: UUID of the strategy version this was branched/updated from.
          nullable: true
        strategy_spec:
          $ref: '#/components/schemas/StrategySpec'
        user_id:
          type: string
          description: Owner user ID (populated from X-User-ID header; null for system/backtest-created).
          nullable: true
        version:
          type: integer
          format: int32
          description: User-assigned version number (1, 2, 3 …). Auto-incremented if omitted.
    StrategySpec:
      type: object
      description: |-
        A script strategy specification.

        JSON shape: `{ "script": "let rsi = ind.rsi(14); ..." }` — no `kind` discriminant needed.
        Legacy records that include `"kind": "script"` are deserialized correctly (unknown fields
        are ignored by serde).
      required:
      - script
      properties:
        script:
          type: string
    UnifiedDataRequest:
      type: object
      description: |-
        Request body for `POST /api/v1/data/:source/:symbol`.
        Indicator computation is handled client-side via WASM — only raw bars are returned.
      properties:
        candles:
          allOf:
          - $ref: '#/components/schemas/CandlesQuery'
          nullable: true
        tf:
          type: string
          nullable: true
    UnifiedDataResponse:
      type: object
      description: Response for `POST /api/v1/data/:source/:symbol` — raw OHLCV bars only.
      required:
      - source
      - symbol
      - tf
      properties:
        candles:
          allOf:
          - $ref: '#/components/schemas/CandlesResult'
          nullable: true
        source:
          type: string
        symbol:
          type: string
        tf:
          type: string
    UpdateStrategyReq:
      type: object
      description: Only label and notes are mutable on an existing version.
      properties:
        label:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
    WalkForwardConfig:
      type: object
      description: Walk-forward validation config.
      required:
      - is_bars
      - oos_bars
      properties:
        embargo_bars:
          type: integer
          nullable: true
          minimum: 0
        is_bars:
          type: integer
          minimum: 0
        min_oos_trades:
          type: integer
          nullable: true
          minimum: 0
        mode:
          type: string
          description: '`"rolling"` (default) | `"anchored"`.'
          nullable: true
        oos_bars:
          type: integer
          minimum: 0
        step_bars:
          type: integer
          nullable: true
          minimum: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT issued by the identity service. Pass as `Authorization: Bearer <token>`.'
security:
- bearerAuth: []
tags:
- name: live
  description: Live ledger data
- name: backtest
  description: Backtest execution
- name: strategy
  description: Saved strategy versions
