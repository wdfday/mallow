openapi: 3.0.3
info:
  title: Herald API
  description: Signal engine HTTP API
  license:
    name: ''
  version: 0.1.0
paths:
  /api/v1/backtest:
    post:
      tags:
      - backtest
      operationId: run_backtest
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
        required: true
      responses:
        '200':
          description: Backtest report
        '400':
          description: Bad request
        '429':
          description: Too many concurrent backtests
  /api/v1/backtest/script:
    post:
      tags:
      - backtest
      operationId: run_backtest_script
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptBacktestRequest'
        required: true
      responses:
        '200':
          description: Script backtest report with saved IDs
        '400':
          description: Bad request
        '429':
          description: Too many concurrent backtests
  /api/v1/data/{source}/{symbol}:
    post:
      tags:
      - live
      operationId: unified_data
      parameters:
      - name: source
        in: path
        description: 'Exchange source: binance | okx | bybit'
        required: true
        schema:
          type: string
      - name: symbol
        in: path
        description: Symbol ticker e.g. BTCUSDT, BTC-USDT
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnifiedDataRequest'
        required: true
      responses:
        '200':
          description: Unified OHLCV + indicator snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedDataResponse'
        '400':
          description: Unknown source
        '404':
          description: Symbol not found in ledger
  /api/v1/indicators:
    get:
      tags:
      - live
      operationId: list_indicators_catalog
      responses:
        '200':
          description: Indicator catalogue (static)
  /api/v1/script/validate:
    post:
      tags:
      - backtest
      operationId: validate_script
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptValidateReq'
        required: true
      responses:
        '200':
          description: Lint result — empty errors means clean script
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptValidateResp'
        '400':
          description: Request body malformed
  /api/v1/strategies:
    get:
      tags:
      - backtest
      operationId: list_strategies
      responses:
        '200':
          description: Named and MTF strategy keys
  /api/v1/strategy/my:
    get:
      tags:
      - strategy
      operationId: list_my_strategies
      responses:
        '200':
          description: Latest version of each strategy owned by the caller
        '401':
          description: Missing X-User-ID header
  /api/v1/strategy/strategies:
    get:
      tags:
      - strategy
      operationId: list_strategies
      responses:
        '200':
          description: List of saved strategies
    post:
      tags:
      - strategy
      operationId: create_strategy
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrategyReq'
        required: true
      responses:
        '201':
          description: Strategy created
        '409':
          description: Conflict — version already exists
  /api/v1/strategy/strategies/{id}:
    get:
      tags:
      - strategy
      operationId: get_strategy
      parameters:
      - name: id
        in: path
        description: Strategy UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Strategy record
        '404':
          description: Not found
    put:
      tags:
      - strategy
      operationId: update_strategy
      parameters:
      - name: id
        in: path
        description: Strategy UUID
        required: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStrategyReq'
        required: true
      responses:
        '200':
          description: Updated strategy record
        '404':
          description: Not found
    delete:
      tags:
      - strategy
      operationId: delete_strategy
      parameters:
      - name: id
        in: path
        description: Strategy UUID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
  /api/v1/strategy/strategies/{id}/chain:
    get:
      tags:
      - strategy
      operationId: list_strategy_chain
      parameters:
      - name: id
        in: path
        description: Any version UUID in the lineage
        required: true
        schema:
          type: string
      responses:
        '200':
          description: All versions in the lineage owned by caller, version DESC
        '401':
          description: Missing X-User-ID header
  /api/v1/stream/signals:
    get:
      tags:
      - stream
      operationId: stream_signals
      responses:
        '200':
          description: 'SSE signal stream (text/event-stream, event: signal)'
  /api/v1/stream/{symbol}:
    post:
      tags:
      - stream
      operationId: stream_bars
      parameters:
      - name: symbol
        in: path
        description: Symbol e.g. BTCUSDT
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamRequest'
        required: true
      responses:
        '200':
          description: SSE bar+indicator stream (text/event-stream)
  /api/v1/symbols:
    get:
      tags:
      - live
      operationId: list_symbols
      parameters:
      - name: indicators
        in: query
        description: Include live indicator cells in the response
        required: false
        schema:
          type: boolean
          nullable: true
      responses:
        '200':
          description: List of tracked symbols grouped by exchange
  /api/v1/watch:
    get:
      tags:
      - watch
      operationId: list_watches
      responses:
        '200':
          description: List of watch entries
    post:
      tags:
      - watch
      operationId: create_watch
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWatchReq'
        required: true
      responses:
        '201':
          description: Watch entry created
        '400':
          description: Validation error
  /api/v1/watch/{id}:
    get:
      tags:
      - watch
      operationId: get_watch
      parameters:
      - name: id
        in: path
        description: Watch entry UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Watch entry
        '404':
          description: Not found
    delete:
      tags:
      - watch
      operationId: delete_watch
      parameters:
      - name: id
        in: path
        description: Watch entry UUID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
components:
  schemas:
    BacktestRequest:
      type: object
      required:
      - strategy
      - symbol
      properties:
        asset_type:
          type: string
          description: |-
            Asset class — controls lot sizing.
            `"crypto"` → fractional qty; `"stock"` → whole shares; `"vn_stock"` → lots of 100.
          nullable: true
        commission_pct:
          type: number
          format: double
          description: 'Commission per trade as a fraction of trade value (default: 0.001).'
          nullable: true
        data_source:
          type: string
          description: |-
            Data source — selects which provider subdirectory to load bars from.
            Values: `"polygon"` (US stocks), `"bnb"` (Binance crypto),
            `"vci"` (VN stocks), `"okx"` (OKX crypto).
            Derives market region automatically: polygon→us, vci→vn, bnb/okx→crypto (no filter).
          nullable: true
        from:
          type: string
          description: 'Date range start, inclusive. Format: `"YYYY-MM-DD"`.'
          nullable: true
        initial_capital:
          type: number
          format: double
          description: 'Starting capital in USD (default: 10 000).'
          nullable: true
        intra_bar_mode:
          type: string
          description: |-
            Intra-bar stop detection mode.
            `"close_only"` (default) | `"pessimistic"` | `"ohlc_heuristic"`.
          nullable: true
        max_positions:
          type: integer
          description: 'Maximum simultaneous open positions (default: 1).'
          nullable: true
          minimum: 0
        monte_carlo:
          allOf:
          - $ref: '#/components/schemas/MonteCarloConfig'
          nullable: true
        params:
          description: |-
            Strategy-specific parameters as a JSON object.

            All values are scalars (`f64` or `u64`), except for array params such as
            GMMA period lists. Unknown keys are silently ignored; missing keys use
            per-strategy defaults.
          nullable: true
        position_size_pct:
          type: number
          format: double
          description: 'Fraction of equity to allocate per trade (default: 0.95).'
          nullable: true
        position_size_quantity:
          type: number
          format: double
          description: Fixed quantity per trade. Overrides both USD and pct sizing.
          nullable: true
        position_size_usd:
          type: number
          format: double
          description: Fixed dollar amount per trade. Overrides `position_size_pct`.
          nullable: true
        risk_free_annual:
          type: number
          format: double
          description: 'Risk-free annual rate used for Sharpe/Sortino (default: 0.04).'
          nullable: true
        slippage_pct:
          type: number
          format: double
          description: 'Slippage per trade as a fraction of trade value (default: 0.0005).'
          nullable: true
        strategy:
          type: string
          description: Strategy key, e.g. `"rsi_mean_rev"`. See `alm-strategy::catalog::STRATEGY_KEYS`.
        symbol:
          type: string
          description: Asset symbol, e.g. `"BTCUSDT"`.
        timeframe:
          type: string
          description: Timeframe subdirectory, e.g. `"H1"`, `"M1"`, `"D1"`.
          nullable: true
        to:
          type: string
          description: 'Date range end, inclusive. Format: `"YYYY-MM-DD"`.'
          nullable: true
        walk_forward:
          allOf:
          - $ref: '#/components/schemas/WalkForwardConfig'
          nullable: true
    BarRecord:
      type: object
      description: Single OHLCV bar on the wire. Short field names to cut payload size.
      required:
      - t
      - o
      - h
      - l
      - c
      - v
      properties:
        c:
          type: number
          format: double
        h:
          type: number
          format: double
        l:
          type: number
          format: double
        n:
          type: integer
          format: int64
          nullable: true
        o:
          type: number
          format: double
        t:
          type: integer
          format: int64
          description: Unix milliseconds (UTC).
        v:
          type: number
          format: double
        vwap:
          type: number
          format: double
          nullable: true
    BarStreamEvent:
      type: object
      description: |-
        SSE bar event — OHLCV bar plus the current value of every requested indicator.

        `indicators` is keyed by label (or canonical key). Each value is a flat map of
        the indicator's output fields, e.g. `{"value": 94150.0}` for EMA or
        `{"upper": 94800.0, "mid": 94200.0, "lower": 93600.0}` for Bollinger Bands.
      required:
      - t
      - o
      - h
      - l
      - c
      - v
      properties:
        c:
          type: number
          format: double
        h:
          type: number
          format: double
        indicators:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: number
              format: double
        l:
          type: number
          format: double
        o:
          type: number
          format: double
        t:
          type: integer
          format: int64
        v:
          type: number
          format: double
    CandlesQuery:
      type: object
      description: Candle section controls of a unified request.
      properties:
        after:
          type: integer
          format: int64
          description: Bars with `t > after`, oldest-first. Unix milliseconds.
          nullable: true
        before:
          type: integer
          format: int64
          description: Bars with `t < before`, newest-first. Unix milliseconds.
          nullable: true
        limit:
          type: integer
          description: Max bars to return. Default 500, max 5000.
          nullable: true
          minimum: 0
    CandlesResult:
      type: object
      required:
      - count
      - bars
      properties:
        bars:
          type: array
          items:
            $ref: '#/components/schemas/BarRecord'
        count:
          type: integer
          minimum: 0
        next_after:
          type: integer
          format: int64
          nullable: true
        next_before:
          type: integer
          format: int64
          nullable: true
        truncated_below:
          type: boolean
    CreateStrategyReq:
      type: object
      required:
      - name
      - label
      - strategy_spec
      properties:
        label:
          type: string
        name:
          type: string
        notes:
          type: string
          nullable: true
        previous_id:
          type: string
          description: UUID of the strategy version this is branched/updated from.
          nullable: true
        strategy_spec:
          $ref: '#/components/schemas/StrategySpec'
        user_id:
          type: string
          description: Override owner user ID. If absent, extracted from X-User-ID header.
          nullable: true
        version:
          type: integer
          format: int32
          description: If omitted, auto-incremented from the highest existing version for `name`.
          nullable: true
    CreateWatchReq:
      type: object
      required:
      - symbols
      - strategy_spec
      properties:
        nats_subject:
          type: string
          nullable: true
        strategy_spec:
          $ref: '#/components/schemas/StrategySpec'
        symbols:
          type: array
          items:
            type: string
        timeframe:
          type: string
          nullable: true
        user_id:
          type: string
          description: Override owner user ID. If absent, extracted from X-User-ID header.
          nullable: true
        webhook_url:
          type: string
          nullable: true
    DeclaredIndicator:
      type: object
      description: Per-line declared indicator summary returned in the lint scope.
      required:
      - name
      - ind_type
      - period
      properties:
        ind_type:
          type: string
        live:
          type: boolean
        multi:
          type: boolean
          description: '`true` → this indicator returns `Array<Map>` (multi-field access).'
        name:
          type: string
        period:
          type: integer
          minimum: 0
        timeframe:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      description: |-
        Error envelope matching the Go `shared.ErrorResponse` shape:
        `{ "status": 400, "code": "BAD_REQUEST", "message": "..." }`.
      required:
      - status
      - message
      properties:
        code:
          type: string
          nullable: true
        message:
          type: string
        status:
          type: integer
          format: int32
          minimum: 0
    IndicatorConfig:
      allOf:
      - type: object
        description: Passed verbatim to `IndicatorBox::from_config`. `"type"` is required.
      - type: object
        properties:
          label:
            type: string
            description: Override the key under which the series appears in the response.
            nullable: true
      description: |-
        Single indicator spec in a unified request. Flat form — anything the
        `alm_indicator::IndicatorBox::from_config` accepts, plus an optional
        `label` to override the response key.

        Example: `{"type":"ema","period":20}` or `{"type":"rsi","period":14,"label":"rsi14"}`.
    IndicatorPoint:
      allOf:
      - type: object
      - type: object
        required:
        - t
        properties:
          t:
            type: integer
            format: int64
      description: |-
        Individual indicator point in a series — `t` plus the indicator's fields.
        Kept flat so clients can address `row.value` / `row.macd` etc.
    IndicatorStatus:
      type: object
      description: Per-indicator warm-up status reported in the `status` SSE event.
      required:
      - ready
      - warm_estimate
      - bars_available
      - bars_needed
      properties:
        bars_available:
          type: integer
          description: Bars currently available in the ledger window.
          minimum: 0
        bars_needed:
          type: integer
          description: How many more bars are needed. 0 when ready.
          minimum: 0
        ready:
          type: boolean
          description: True when `ready_since_t` is set AND `bars_available >= warm_estimate`.
        warm_estimate:
          type: integer
          description: Estimated bars needed for stable convergence (EMA decay formula or exact period).
          minimum: 0
    LintDiagnostic:
      type: object
      description: A lint diagnostic with Monaco-compatible line/col coordinates (1-based).
      required:
      - line
      - col
      - message
      - severity
      properties:
        col:
          type: integer
          description: 1-based column number (0 = unknown).
          minimum: 0
        line:
          type: integer
          description: 1-based line number (0 = unknown / whole-script).
          minimum: 0
        message:
          type: string
        severity:
          type: string
          description: '`"error"` or `"warning"`.'
    MonteCarloConfig:
      type: object
      description: Monte Carlo bootstrap config.
      properties:
        n_iter:
          type: integer
          description: 'Bootstrap iterations (default: 1 000).'
          nullable: true
          minimum: 0
        ruin_threshold:
          type: number
          format: double
          description: 'Ruin floor as fraction of initial capital (default: 0.50).'
          nullable: true
        seed:
          type: integer
          format: int64
          description: RNG seed for reproducibility (`null` = time-based).
          nullable: true
          minimum: 0
    ScriptBacktestRequest:
      type: object
      description: |-
        Dedicated request for script backtests.
        Takes a `script` field containing the full strategy script.

        Any `plot("name", value)` calls inside the script populate
        `indicator_series` in the response.

        Every request to this endpoint is persisted: strategy + case are created or
        updated before the engine runs, and the result is saved on completion.
        Use `case_id` to re-run an existing case (params may differ — the case row
        is updated in place). Omit `case_id` to open a new case.
      required:
      - symbol
      - script
      - name
      properties:
        asset_type:
          type: string
          nullable: true
        commission_pct:
          type: number
          format: double
          nullable: true
        data_source:
          type: string
          nullable: true
        from:
          type: string
          nullable: true
        initial_capital:
          type: number
          format: double
          nullable: true
        intra_bar_mode:
          type: string
          nullable: true
        label:
          type: string
          description: Human-readable case label. Defaults to `"{name} on {symbol}"` if omitted.
          nullable: true
        max_positions:
          type: integer
          nullable: true
          minimum: 0
        monte_carlo:
          allOf:
          - $ref: '#/components/schemas/MonteCarloConfig'
          nullable: true
        name:
          type: string
          description: Strategy name (slug). Used to group versions; required for server-side runs.
        notes:
          type: string
          description: Optional change notes attached to the strategy version.
          nullable: true
        position_size_pct:
          type: number
          format: double
          nullable: true
        position_size_quantity:
          type: number
          format: double
          nullable: true
        position_size_usd:
          type: number
          format: double
          nullable: true
        risk_free_annual:
          type: number
          format: double
          nullable: true
        script:
          type: string
          description: Full strategy script.
        slippage_pct:
          type: number
          format: double
          nullable: true
        symbol:
          type: string
          description: Symbol to backtest, e.g. `"BTCUSDT"`.
        timeframe:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
        walk_forward:
          allOf:
          - $ref: '#/components/schemas/WalkForwardConfig'
          nullable: true
    ScriptLintScope:
      type: object
      description: Scope information for Monaco autocomplete / hover.
      required:
      - indicators
      - bar_fields
      - output_vars
      - functions
      properties:
        bar_fields:
          type: array
          items:
            type: string
        functions:
          type: array
          items:
            type: string
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/DeclaredIndicator'
        output_vars:
          type: array
          items:
            type: string
    ScriptValidateReq:
      type: object
      required:
      - script
      properties:
        base_tf:
          type: string
          description: |-
            Optional base timeframe (e.g. `"M1"`, `"H1"`). When provided, the linter
            will flag any HTF indicator declared on a TF smaller than the base TF.
          nullable: true
        script:
          type: string
          description: Full strategy script to lint.
    ScriptValidateResp:
      type: object
      required:
      - errors
      - scope
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/LintDiagnostic'
          description: List of diagnostics. Empty → script is clean.
        scope:
          $ref: '#/components/schemas/ScriptLintScope'
    Strategy:
      type: object
      description: |-
        A versioned strategy definition. Each (name, version) pair is immutable
        once created — create a new version to iterate on a spec.
      required:
      - id
      - name
      - version
      - label
      - strategy_spec
      - created_at
      properties:
        created_at:
          type: integer
          format: int64
        id:
          type: string
          description: UUID v7 — identifies this exact version.
        label:
          type: string
          description: Human-readable display label.
        name:
          type: string
          description: Stable slug that groups all versions of the same strategy.
        notes:
          type: string
          description: Optional change notes for this version.
          nullable: true
        previous_id:
          type: string
          description: UUID of the strategy version this was branched/updated from.
          nullable: true
        strategy_spec:
          $ref: '#/components/schemas/StrategySpec'
        user_id:
          type: string
          description: Owner user ID (populated from X-User-ID header; null for system/backtest-created).
          nullable: true
        version:
          type: integer
          format: int32
          description: User-assigned version number (1, 2, 3 …). Auto-incremented if omitted.
    StrategySpec:
      type: object
      description: |-
        A script strategy specification.

        JSON shape: `{ "script": "let rsi = ind.rsi(14); ..." }` — no `kind` discriminant needed.
        Legacy records that include `"kind": "script"` are deserialized correctly (unknown fields
        are ignored by serde).
      required:
      - script
      properties:
        script:
          type: string
    StreamRequest:
      type: object
      description: |-
        Request body for `POST /api/stream/:symbol`.

        Exactly one of `indicators` or `script` should be provided:
        - `indicators`: structured list of indicator configs (no computation)
        - `script`: Script using `ind.TYPE(period)` + `plot("name", value)`
      properties:
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/IndicatorConfig'
          description: Structured indicator mode — returns raw cell values per bar.
          nullable: true
        script:
          type: string
          description: Script mode — script runs per bar, returns whatever was `plot()`-ed.
          nullable: true
        tf:
          type: string
          nullable: true
    StreamStatus:
      type: object
      description: First SSE event sent on every new stream connection.
      required:
      - bars_available
      - all_ready
      - indicators
      properties:
        all_ready:
          type: boolean
          description: True when every requested indicator passes its warm_estimate check.
        bars_available:
          type: integer
          minimum: 0
        indicators:
          type: object
          description: Keyed by var_name (script mode) or label (structured mode).
          additionalProperties:
            $ref: '#/components/schemas/IndicatorStatus'
    UnifiedDataRequest:
      type: object
      properties:
        candles:
          allOf:
          - $ref: '#/components/schemas/CandlesQuery'
          nullable: true
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/IndicatorConfig'
          nullable: true
        tf:
          type: string
          nullable: true
    UnifiedDataResponse:
      type: object
      required:
      - source
      - symbol
      - tf
      properties:
        candles:
          allOf:
          - $ref: '#/components/schemas/CandlesResult'
          nullable: true
        indicators:
          type: object
          description: Keyed by `label` or the indicator's canonical key when `label` is omitted.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/IndicatorPoint'
          nullable: true
        missing:
          type: array
          items:
            type: string
          description: |-
            Specs that were requested but could not be satisfied — bad config,
            missing `"type"`, exceeded `max_period`, etc. Empty on the happy path.
        source:
          type: string
        symbol:
          type: string
        tf:
          type: string
    UpdateStrategyReq:
      type: object
      description: Only label and notes are mutable on an existing version.
      properties:
        label:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
    WalkForwardConfig:
      type: object
      description: Walk-forward validation config.
      required:
      - is_bars
      - oos_bars
      properties:
        embargo_bars:
          type: integer
          nullable: true
          minimum: 0
        is_bars:
          type: integer
          minimum: 0
        min_oos_trades:
          type: integer
          nullable: true
          minimum: 0
        mode:
          type: string
          description: '`"rolling"` (default) | `"anchored"`.'
          nullable: true
        oos_bars:
          type: integer
          minimum: 0
        step_bars:
          type: integer
          nullable: true
          minimum: 0
    WatchEntry:
      type: object
      description: |-
        A registered watch — runs a strategy on live bars and dispatches
        signals to a webhook or NATS subject instead of executing trades.
      required:
      - id
      - symbols
      - strategy_spec
      - pinned_indicators
      - created_at
      properties:
        created_at:
          type: integer
          format: int64
        id:
          type: string
        nats_subject:
          type: string
          description: NATS subject to publish SignalMsg to.
          nullable: true
        pinned_indicators:
          type: integer
          description: Number of indicator handles pinned in the ledger by this entry.
          minimum: 0
        strategy_spec:
          $ref: '#/components/schemas/StrategySpec'
        symbols:
          type: array
          items:
            type: string
        timeframe:
          type: string
          nullable: true
        user_id:
          type: string
          description: Owner user ID (populated from X-User-ID header).
          nullable: true
        webhook_url:
          type: string
          description: HTTP endpoint to POST signal JSON to when strategy fires.
          nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT issued by the identity service. Pass as `Authorization: Bearer <token>`.'
security:
- bearerAuth: []
tags:
- name: live
  description: Live ledger data
- name: backtest
  description: Backtest execution
- name: strategy
  description: Saved strategy versions
- name: watch
  description: Watchlist / warm-set management
- name: stream
  description: SSE real-time push
