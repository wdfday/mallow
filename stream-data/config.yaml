# ---------------------------------------------------------------------------
# Bar aggregation: tick → OHLCV bars published to bars.{symbol} via JetStream.
# ---------------------------------------------------------------------------
bars:
  interval: 1m   # aggregation window: 1m | 5m | 15m | 1h etc.

# ---------------------------------------------------------------------------
# NATS publisher.
#   - Core NATS: ticks.{class}.{symbol} (raw JSON ticks, fire-and-forget)
#   - JetStream:  bars.{symbol}          (BarMsg protobuf, durable)
# URL can be overridden via NATS_URL env var.
# ---------------------------------------------------------------------------
nats:
  enabled: true
  url: "nats://localhost:4222"
