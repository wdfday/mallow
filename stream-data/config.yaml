data:
  dir: data/stream      # root output directory; files land in {dir}/{class}/{symbol}/
  format: parquet       # parquet | csv | json
  flushInterval: 1m     # flush every N duration
  maxBufferSize: 50000  # also flush early if total buffered ticks exceeds this (0 = disabled)

log:
  level: info            # debug | info | warn | error
  format: text          # text (dev) | json (production)
  file: "data/stream.log"

